  <path d="M153 80 L153 74 A7 7 0 0 1 167 74 L167 80" fill="none" stroke="#00E87B" stroke-width="1.5" opacity="0.6"/>
  <circle cx="160" cy="87" r="2" fill="#00E87B" opacity="0.8"/>
