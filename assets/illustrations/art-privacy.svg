  <text x="248" y="67" fill="#FA582D" font-size="10" opacity="0.5">✕</text>
  <line x1="245" y1="120" x2="320" y2="120" stroke="#FA582D" stroke-width="1" opacity="0.2"/>
  <text x="248" y="117" fill="#FA582D" font-size="10" opacity="0.4">✕</text>
