  <rect x="232" y="88" width="20" height="8" rx="2" fill="#00E87B" opacity="0.2"/>

  <rect x="60" y="110" width="200" height="24" rx="3" fill="#00C0E8" opacity="0.06" stroke="#00C0E8" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="70" y="125" fill="#00C0E8" font-family="monospace" font-size="9" opacity="0.5">yi-34b</text>
  <text x="220" y="125" fill="#555" font-family="monospace" font-size="8" text-anchor="end">downloading...</text>
