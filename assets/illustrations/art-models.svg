      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <!-- Model blocks stacked -->
  <rect x="60" y="20" width="200" height="24" rx="3" fill="#00E87B" opacity="0.12" stroke="#00E87B" stroke-width="0.8"/>
