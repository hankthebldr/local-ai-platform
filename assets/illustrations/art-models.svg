  <rect x="60" y="50" width="200" height="24" rx="3" fill="#00E87B" opacity="0.08" stroke="#1a1a2e" stroke-width="0.8"/>
  <text x="70" y="65" fill="#888" font-family="monospace" font-size="9">mistral-7b</text>
  <text x="220" y="65" fill="#555" font-family="monospace" font-size="8" text-anchor="end">4.1GB</text>
  <rect x="232" y="58" width="20" height="8" rx="2" fill="#00E87B" opacity="0.3"/>

  <rect x="60" y="80" width="200" height="24" rx="3" fill="#00E87B" opacity="0.06" stroke="#1a1a2e" stroke-width="0.8"/>
