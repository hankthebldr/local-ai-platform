<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <!-- Machine 1: Mac M4 -->
  <rect x="20" y="55" width="70" height="70" rx="6" fill="none" stroke="#00C0E8" stroke-width="1.2"/>
  <text x="55" y="75" text-anchor="middle" fill="#00C0E8" font-family="monospace" font-size="7" opacity="0.8">Mac M4 Pro</text>
  <text x="55" y="87" text-anchor="middle" fill="#555" font-family="monospace" font-size="6">48GB • dev</text>
  <rect x="32" y="95" width="46" height="12" rx="2" fill="#00C0E8" opacity="0.1" stroke="#00C0E8" stroke-width="0.5"/>
  <text x="55" y="104" text-anchor="middle" fill="#00C0E8" font-family="monospace" font-size="6" opacity="0.6">mistral-7b</text>

  <!-- Machine 2: MS-01 -->
  <rect x="125" y="35" width="70" height="70" rx="6" fill="none" stroke="#00E87B" stroke-width="1.5"/>
  <text x="160" y="55" text-anchor="middle" fill="#00E87B" font-family="monospace" font-size="7" font-weight="bold">MS-01</text>
  <text x="160" y="67" text-anchor="middle" fill="#555" font-family="monospace" font-size="6">64GB • API</text>
  <rect x="137" y="73" width="46" height="12" rx="2" fill="#00E87B" opacity="0.15" stroke="#00E87B" stroke-width="0.5"/>
  <text x="160" y="82" text-anchor="middle" fill="#00E87B" font-family="monospace" font-size="6" opacity="0.7">dolphin-mix</text>
  <rect x="137" y="88" width="46" height="12" rx="2" fill="#00E87B" opacity="0.08" stroke="#1a1a2e" stroke-width="0.5"/>
  <text x="160" y="97" text-anchor="middle" fill="#888" font-family="monospace" font-size="6">hermes2</text>

  <!-- Machine 3: BD790i -->
  <rect x="230" y="55" width="70" height="70" rx="6" fill="none" stroke="#00E87B" stroke-width="1.2" opacity="0.7"/>
  <text x="265" y="75" text-anchor="middle" fill="#00E87B" font-family="monospace" font-size="7" opacity="0.7">BD790i</text>
  <text x="265" y="87" text-anchor="middle" fill="#555" font-family="monospace" font-size="6">96GB • research</text>
  <rect x="242" y="95" width="46" height="12" rx="2" fill="#00E87B" opacity="0.08" stroke="#1a1a2e" stroke-width="0.5"/>
  <text x="265" y="104" text-anchor="middle" fill="#888" font-family="monospace" font-size="6">yi-34b</text>

  <!-- Connection lines -->
  <line x1="92" y1="85" x2="123" y2="75" stroke="#1a1a2e" stroke-width="1"/>
  <line x1="197" y1="75" x2="228" y2="85" stroke="#1a1a2e" stroke-width="1"/>
  <circle cx="92" cy="85" r="2" fill="#00C0E8" opacity="0.4"/>
  <circle cx="228" cy="85" r="2" fill="#00E87B" opacity="0.4"/>

  <!-- Network label -->
  <line x1="55" y1="130" x2="265" y2="130" stroke="#1a1a2e" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="160" y="145" text-anchor="middle" fill="#333" font-family="monospace" font-size="7">local network • 10Gbe</text>

  <!-- Central glow -->
  <circle cx="160" cy="70" r="40" fill="#00E87B" opacity="0.03"/>
</svg>
