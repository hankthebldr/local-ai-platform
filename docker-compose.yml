# Local AI Platform — Full Stack
# Usage: docker compose up -d
#
# Services:
#   ollama  — LLM inference engine (port 11434)
#   api     — OpenAI-compatible API (port 8000)
#   webui   — Open WebUI chat interface (port 8080)
#
# Data persistence via named volumes (survive container restarts)

services:
  # ── Ollama — LLM Inference Engine ────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: local-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── API Server — OpenAI-compatible endpoints ─────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-ai-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # Auth defaults to ON. On first boot, a master key is auto-provisioned
      # and written to data/config/first-run-key.txt (also logged once at INFO).
      # `docker compose logs api | grep "FIRST-RUN"` to retrieve it.
      - ENABLE_API_AUTH=${ENABLE_API_AUTH:-true}
      - API_KEY=${API_KEY:-}
      # SPA boot fires ~10 parallel fetches and the system poller adds more
      # every few seconds — 60 RPM throttled normal interactive use AND
      # caused the Playwright E2E suite to 429-storm. 600 is a sensible
      # local-dev default (10/sec average, well above human-driven traffic).
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-600}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Bumped 300→900s in #79 — covers CPU-only inference of long
      # grounded prompts. GPU deployments can drop to 120-180s.
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-900}
      # LLM serialization — on CPU-only hardware, two models competing
      # for the same prefill bandwidth deliver worse total throughput than
      # serial execution. Default 1 enforces strict serialization. Raise
      # for GPU deployments where parallel decode is actually faster.
      - MAX_CONCURRENT_LLM=${MAX_CONCURRENT_LLM:-1}
      # How long Ollama keeps a loaded GGUF in RAM after its last request.
      # Adjacent workflow steps using the same model reuse the loaded
      # weights instead of paying the 30-90s unload+reload tax.
      # Go duration string: "10m", "24h", "0" (evict immediately), "-1" (never).
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-10m}
      # TTL (seconds) for the model-list cache in ModelResolver.
      # A 10-step workflow previously made 10 /api/tags round-trips; with
      # a 30s TTL it makes one. Lower if models are pulled mid-run.
      - MODEL_LIST_TTL=${MODEL_LIST_TTL:-30}
      # CORS_ORIGINS — by default we don't allow any cross-origin browser
      # since the Enclave SPA is same-origin with the API. The legacy
      # entries for :8081 (Open WebUI, now opt-in) and :3000 (vite/Next
      # dev) are kept for operators who turn either back on. Set to ["*"]
      # for permissive local dev, or a list of explicit origins for prod.
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:8081","http://localhost:3000"]}
      # Host hardware truth — Docker Desktop's Linux VM hides the real host
      # from psutil. Operators set these from the shell before `compose up`
      # so the SPA reports the actual machine instead of the container slice.
      # macOS:  export ENCLAVE_HOST_RAM_GB=$(($(sysctl -n hw.memsize)/1073741824))
      #         export ENCLAVE_HOST_CPU_CORES=$(sysctl -n hw.physicalcpu)
      #         export ENCLAVE_HOST_CPU_BRAND="$(sysctl -n machdep.cpu.brand_string)"
      # Linux:  cat /proc/meminfo  +  nproc  +  lscpu
      - ENCLAVE_HOST_RAM_GB=${ENCLAVE_HOST_RAM_GB:-}
      - ENCLAVE_HOST_CPU_CORES=${ENCLAVE_HOST_CPU_CORES:-}
      - ENCLAVE_HOST_CPU_BRAND=${ENCLAVE_HOST_CPU_BRAND:-}
      - ENCLAVE_HOST_PLATFORM=${ENCLAVE_HOST_PLATFORM:-}
      # GPU model string (e.g. "NVIDIA RTX 4000 Blackwell"). Set by
      # scripts/host-preset.sh on hosts with a discrete GPU; surfaced
      # in /api/inventory/system so the SPA can show acceleration
      # status. Empty string ⇒ CPU-only.
      - ENCLAVE_HOST_GPU=${ENCLAVE_HOST_GPU:-}
    volumes:
      # All API state lives under /app/data. Persisting the whole dir
      # survives container rebuild — keystore (data/config/),
      # workflow runs (data/workflows/), Chroma RAG store (data/rag/),
      # and uploaded documents. Without this, a `docker compose build`
      # wipes issued keys, completed workflow runs, and ingested docs.
      - api_data:/app/data
      # Logs keep their own named volume for log-rotation-friendly
      # backup workflows. Nested mount: more-specific path wins, so
      # /app/data/logs lives in api_logs while everything else under
      # /app/data lives in api_data.
      - api_logs:/app/data/logs
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Open WebUI was previously bundled on :8080 as a generic chat client,
  # but it competes visually with the Enclave SPA at :8000 (its own login
  # screen reads as a confusing "auth error" for operators expecting the
  # Enclave UI). Moved to docker-compose.webui.yml as an opt-in override.
  # To re-add:
  #   docker compose -f docker-compose.yml -f docker-compose.webui.yml up -d

volumes:
  ollama_data:
    name: local-ai-ollama-data
  api_data:
    name: local-ai-api-data
  api_logs:
    name: local-ai-api-logs
