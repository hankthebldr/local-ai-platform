# Local AI Platform — Full Stack
# Usage: docker compose up -d
#
# Services:
#   ollama  — LLM inference engine (port 11434)
#   api     — OpenAI-compatible API (port 8000)
#   webui   — Open WebUI chat interface (port 8080)
#
# Data persistence via named volumes (survive container restarts)

services:
  # ── Ollama — LLM Inference Engine ────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: local-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── API Server — OpenAI-compatible endpoints ─────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-ai-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # Auth defaults to ON. On first boot, a master key is auto-provisioned
      # and written to data/config/first-run-key.txt (also logged once at INFO).
      # `docker compose logs api | grep "FIRST-RUN"` to retrieve it.
      - ENABLE_API_AUTH=${ENABLE_API_AUTH:-true}
      - API_KEY=${API_KEY:-}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-900}
      # LLM serialization — on CPU-only hardware, two models competing
      # for the same prefill bandwidth deliver worse total throughput than
      # serial execution. Default 1 enforces strict serialization. Raise
      # for GPU deployments where parallel decode is actually faster.
      - MAX_CONCURRENT_LLM=${MAX_CONCURRENT_LLM:-1}
      # How long Ollama keeps a loaded GGUF in RAM after its last request.
      # Adjacent workflow steps using the same model reuse the loaded
      # weights instead of paying the 30-90s unload+reload tax.
      # Go duration string: "10m", "24h", "0" (evict immediately), "-1" (never).
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-10m}
      # TTL (seconds) for the model-list cache in ModelResolver.
      # A 10-step workflow previously made 10 /api/tags round-trips; with
      # a 30s TTL it makes one. Lower if models are pulled mid-run.
      - MODEL_LIST_TTL=${MODEL_LIST_TTL:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:8080","http://localhost:3000"]}
    volumes:
      # All API state lives under /app/data. Persisting the whole dir
      # survives container rebuild — keystore (data/config/),
      # workflow runs (data/workflows/), Chroma RAG store (data/rag/),
      # and uploaded documents. Without this, a `docker compose build`
      # wipes issued keys, completed workflow runs, and ingested docs.
      - api_data:/app/data
      # Logs keep their own named volume for log-rotation-friendly
      # backup workflows. Nested mount: more-specific path wins, so
      # /app/data/logs lives in api_logs while everything else under
      # /app/data lives in api_data.
      - api_logs:/app/data/logs
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Open WebUI — Chat Interface ──────────────────────────────────────
  webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: local-ai-webui
    ports:
      - "8080:8080"
    environment:
      # Connect to our API server (OpenAI-compatible)
      - OPENAI_API_BASE_URL=http://api:8000/v1
      - OPENAI_API_KEY=${API_KEY:-sk-local}
      # Also connect directly to Ollama for native features
      - OLLAMA_BASE_URL=http://ollama:11434
      # WebUI auth: set WEBUI_AUTH=false to disable for trusted local-only setups.
      - WEBUI_AUTH=${WEBUI_AUTH:-true}
    volumes:
      - webui_data:/app/backend/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
    name: local-ai-ollama-data
  api_data:
    name: local-ai-api-data
  api_logs:
    name: local-ai-api-logs
  webui_data:
    name: local-ai-webui-data
