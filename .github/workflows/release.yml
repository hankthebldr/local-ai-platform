name: Release

# Cuts a stable GitHub Release when a release PR merges into `main` (the
# branch model's release event -- see docs/BRANCHING.md), and again on a
# `vX.Y.Z` tag pushed by hand. Pushes to `dev` produce the rolling `nightly`
# pre-release. Build jobs run in parallel and upload artifacts; a publish job
# downloads everything and creates the Release so users get DMG + wheel +
# sdist + tarball + checksums together.

on:
  push:
    branches: [dev, main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ── Shared metadata ───────────────────────────────────────────────────

  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      release_kind: ${{ steps.r.outputs.release_kind }}
      version: ${{ steps.r.outputs.version }}
      version_bare: ${{ steps.r.outputs.version_bare }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine release kind + version
        id: r
        # Three entry points:
        #   refs/tags/v*   -> stable, version comes from the tag (manual cut)
        #   refs/heads/main-> stable, version read from api/__init__.py and the
        #                     tag created here. A merge into main IS the release.
        #                     If that tag already exists the run degrades to a
        #                     no-op so a docs-only merge cannot re-publish or
        #                     clobber a shipped release.
        #   refs/heads/dev -> rolling nightly pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              version="${GITHUB_REF#refs/tags/}"
              echo "release_kind=stable" >> "$GITHUB_OUTPUT"
              echo "version=${version}" >> "$GITHUB_OUTPUT"
              echo "version_bare=${version#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              bare="$(grep -oP '__version__\s*=\s*["\x27]\K[^"\x27]+' api/__init__.py)"
              if [ -z "${bare}" ]; then
                  echo "::error::Could not read __version__ from api/__init__.py"
                  exit 1
              fi
              version="v${bare}"

              if git rev-parse -q --verify "refs/tags/${version}" >/dev/null || \
                 git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null 2>&1; then
                  echo "::notice::Tag ${version} already exists -- nothing to release." \
                       "Bump __version__ in api/__init__.py to cut a new one."
                  echo "release_kind=none" >> "$GITHUB_OUTPUT"
                  echo "version=${version}" >> "$GITHUB_OUTPUT"
                  echo "version_bare=${bare}" >> "$GITHUB_OUTPUT"
                  exit 0
              fi

              git config user.name  "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "${version}" -m "Release ${version}"
              git push origin "refs/tags/${version}"
              echo "::notice::Tagged ${version} from the merge into main."

              echo "release_kind=stable" >> "$GITHUB_OUTPUT"
              echo "version=${version}" >> "$GITHUB_OUTPUT"
              echo "version_bare=${bare}" >> "$GITHUB_OUTPUT"
          else
              short_sha="$(git rev-parse --short HEAD)"
              echo "release_kind=nightly" >> "$GITHUB_OUTPUT"
              echo "version=nightly-${short_sha}" >> "$GITHUB_OUTPUT"
              echo "version_bare=nightly-${short_sha}" >> "$GITHUB_OUTPUT"
          fi

  # ── macOS DMG ─────────────────────────────────────────────────────────

  build-macos:
    name: Build macOS DMG
    if: needs.meta.outputs.release_kind != 'none'
    needs: meta
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed so build_mac.sh's git describe sees them.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install librsvg + create-dmg
        run: brew install librsvg create-dmg

      - name: Regenerate assets
        run: |
          ./scripts/generate-icons.sh
          ls -la assets/icons/icon.icns

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r setup/requirements-core.txt

      - name: Build DMG
        env:
          ENCLAVE_VERSION: ${{ needs.meta.outputs.version }}
        run: ./scripts/build_mac.sh

      - name: Verify DMG exists
        run: |
          test -f dist/Enclave.dmg
          ls -la dist/

      - name: Boot the freshly built bundle and probe UX routes
        # Same gate dmg-smoke runs in ci.yml — never publish a broken DMG.
        run: |
          set -e
          BUNDLE="dist/Enclave.app/Contents/Resources"
          export PYTHONPATH="$BUNDLE"
          export ENABLE_API_AUTH=false
          export API_HOST=127.0.0.1
          export API_PORT=8765

          "$BUNDLE/venv/bin/python" -m api.main >api.log 2>&1 &
          API_PID=$!
          trap "kill $API_PID 2>/dev/null || true" EXIT

          for _ in $(seq 1 30); do
              if curl -sf -m 2 http://127.0.0.1:8765/health >/dev/null; then
                  break
              fi
              sleep 0.5
          done

          for path in /health / /static/index.html /setup /api/info; do
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                  -m 5 "http://127.0.0.1:8765${path}")
              if [ "$code" != "200" ]; then
                  echo "::error::UX route ${path} returned HTTP ${code}"
                  echo "--- api log ---"; tail -80 api.log
                  exit 1
              fi
              echo "  ok  ${path} -> ${code}"
          done

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: enclave-dmg
          path: dist/Enclave.dmg
          if-no-files-found: error
          retention-days: 14

  # ── Python wheel + sdist ──────────────────────────────────────────────

  build-python:
    name: Build Python wheel + sdist
    if: needs.meta.outputs.release_kind != 'none'
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build wheel + sdist
        run: python -m build --wheel --sdist --outdir dist
      - name: Validate package metadata
        # twine check catches malformed long_description / classifiers /
        # license fields before they break a `pip install` for somebody.
        run: twine check dist/*
      - name: Smoke-test wheel imports in a clean venv
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          /tmp/wheel-check/bin/python -c "
          import api, cli
          from api import __version__
          from cli import dispatcher
          print(f'enclave {__version__} imports OK')
          "
      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enclave-python
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ── Linux source tarball + checksums ──────────────────────────────────

  build-tarball:
    name: Build Linux source tarball
    if: needs.meta.outputs.release_kind != 'none'
    needs: meta
    runs-on: ubuntu-latest
    env:
      VERSION_BARE: ${{ needs.meta.outputs.version_bare }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack source tree via git-archive
        # Using git-archive (rather than `tar` on the working tree) means
        # the tarball matches the tagged commit exactly — no stray local
        # files, no venv, no built artifacts.
        run: |
          set -e
          mkdir -p out
          git archive --format=tar.gz \
              --prefix="enclave-${VERSION_BARE}/" \
              -o "out/enclave-source-${VERSION_BARE}.tar.gz" \
              "${GITHUB_SHA}"
          (cd out && \
              shasum -a 256 "enclave-source-${VERSION_BARE}.tar.gz" \
                  > "enclave-source-${VERSION_BARE}.tar.gz.sha256" && \
              shasum -a 512 "enclave-source-${VERSION_BARE}.tar.gz" \
                  > "enclave-source-${VERSION_BARE}.tar.gz.sha512")
          ls -la out/
      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: enclave-tarball
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # ── Publish stable release (tag push) ─────────────────────────────────

  publish-stable:
    name: Publish stable release
    if: needs.meta.outputs.release_kind == 'stable'
    needs: [meta, build-macos, build-python, build-tarball]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      VERSION_BARE: ${{ needs.meta.outputs.version_bare }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts into one release dir
        run: |
          set -e
          mkdir -p release
          find artifacts -type f -exec cp -v {} release/ \;
          ls -la release/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Enclave ${{ needs.meta.outputs.version }}
          generate_release_notes: true
          body: |
            ## Enclave ${{ needs.meta.outputs.version }}

            Self-hosted AI inference. CPU-optimized. Source-available.

            ### Pick an install path

            | Path | File | Notes |
            |---|---|---|
            | macOS DMG | `Enclave.dmg` | drag to `/Applications`, then `xattr -dr com.apple.quarantine /Applications/Enclave.app` |
            | Docker | `docker pull hankthebldrr/local-ai-platfrom:${{ needs.meta.outputs.version_bare }}` | mirrored to `ghcr.io/hankthebldr/enclave:${{ needs.meta.outputs.version_bare }}` |
            | Python wheel | `enclave-${{ needs.meta.outputs.version_bare }}-py3-none-any.whl` | `pip install <url>` — no PyPI account required |
            | Python sdist | `enclave-${{ needs.meta.outputs.version_bare }}.tar.gz` | source build from this tag |
            | Linux source tarball | `enclave-source-${{ needs.meta.outputs.version_bare }}.tar.gz` (+ `.sha256` / `.sha512`) | full repo snapshot from this commit |

            ### Install (macOS app)

            1. Download **Enclave.dmg** from Assets below.
            2. Open the DMG and drag **Enclave.app** to `/Applications`.
            3. First launch — Gatekeeper will warn (build is **not yet signed/notarized**). Bypass once with:
               ```bash
               xattr -dr com.apple.quarantine /Applications/Enclave.app
               ```
            4. Launch **Enclave** — the native window opens the first-run setup wizard at `/setup`, which installs Ollama and pulls a starter model.

            **Requirements:** macOS 12.0 (Monterey) or later · ~6 GB free disk.

            ### Install (Docker)

            ```bash
            docker pull hankthebldrr/local-ai-platfrom:${{ needs.meta.outputs.version_bare }}
            # or the no-Hub-account mirror:
            docker pull ghcr.io/hankthebldr/enclave:${{ needs.meta.outputs.version_bare }}
            ```

            ### Install (pip)

            ```bash
            pip install https://github.com/hankthebldr/local-ai-platform/releases/download/${{ needs.meta.outputs.version }}/enclave-${{ needs.meta.outputs.version_bare }}-py3-none-any.whl
            enclave-api               # boots FastAPI on 127.0.0.1:8000
            enclave version           # prints the installed version
            ```

            ### Install (from source)

            ```bash
            git clone https://github.com/hankthebldr/local-ai-platform.git
            cd local-ai-platform
            git checkout ${{ needs.meta.outputs.version }}
            ./setup/install.sh
            ./scripts/start.sh
            ```

            See the [README](https://github.com/hankthebldr/local-ai-platform/blob/${{ needs.meta.outputs.version }}/README.md), [Wiki](https://github.com/hankthebldr/local-ai-platform/wiki), and the [CHANGELOG](https://github.com/hankthebldr/local-ai-platform/blob/${{ needs.meta.outputs.version }}/CHANGELOG.md).

            ### Verify the build

            Every release passes a macOS boot probe in CI before publish: the DMG is built, the .app is launched, and the dashboard / setup wizard / API surfaces all confirmed serving 200s. The Python wheel is also smoke-tested with a fresh-venv import. If you see this release, those checks passed.
          files: |
            release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Publish rolling nightly (dev push) ────────────────────────────────

  publish-nightly:
    name: Publish nightly pre-release
    if: needs.meta.outputs.release_kind == 'nightly'
    needs: [meta, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: enclave-dmg
          path: dist
      - name: Replace the rolling nightly release
        # Tears down the previous nightly so the new one becomes the
        # canonical pre-release. --cleanup-tag removes the moving tag too.
        # Only the DMG ships in nightly to keep the asset list short;
        # wheel/sdist/tarball were built (above) to verify CI but aren't
        # attached — use a stable tag if you need pinned non-DMG artifacts.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          gh release delete nightly --yes --cleanup-tag --repo "$REPO" 2>/dev/null || true

          gh release create nightly \
              --repo "$REPO" \
              --title "Enclave nightly (${VERSION})" \
              --notes "## Nightly build

          Auto-built and smoke-tested from \`dev\` @ \`${COMMIT_SHA}\`.

          **This release is replaced on every merge into \`dev\`.** For a pinned, immutable build use a numbered \`vX.Y.Z\` release instead.

          ### Install

          1. Download **Enclave.dmg** from Assets below.
          2. Open it and drag **Enclave.app** to \`/Applications\`.
          3. First launch (Gatekeeper bypass — build is unsigned):
             \`\`\`
             xattr -dr com.apple.quarantine /Applications/Enclave.app
             \`\`\`
          4. Launch Enclave → setup wizard → dashboard.

          **Requirements:** macOS 12.0 (Monterey) or later.

          For Docker, wheel, and tarball downloads, use the latest stable release — the nightly only ships the DMG. See the [README](https://github.com/hankthebldr/local-ai-platform/blob/main/README.md) for full quickstart.
          " \
              --prerelease \
              --target "${COMMIT_SHA}" \
              dist/Enclave.dmg
