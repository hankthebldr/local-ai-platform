name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r setup/requirements-core.txt
          pip install -r setup/requirements-dev.txt
          pip install pytest-cov

      # Excluded suites:
      #   Integration / TestAuthentication / TestMultiKeyAuth — require a live
      #     Ollama instance and on-disk api_keys.yaml setup; run locally only.
      #   -m "not rag" — RAG suite needs sentence-transformers + Chroma which
      #     are heavy to install on every CI run.
      # Coverage is reported but not yet enforced; the 2.0.0 bar is >=70%.
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short \
            -k "not Integration and not TestAuthentication and not TestMultiKeyAuth" \
            -m "not rag" \
            --cov=api --cov-report=term --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy

      - name: Check formatting (black)
        run: black --check api/ cli/ models/ || echo "::warning::Black formatting issues (non-blocking)"
        continue-on-error: true

      - name: Lint (flake8)
        run: flake8 api/ cli/ models/ --max-line-length=120 --extend-ignore=E501,W503 || echo "::warning::Flake8 issues (non-blocking)"
        continue-on-error: true
