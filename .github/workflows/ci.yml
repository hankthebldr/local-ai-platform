name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # triage issue emitter; fork PRs get a read-only token anyway
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r setup/requirements-core.txt
          pip install -r setup/requirements-dev.txt
          pip install pytest-cov

      # Excluded suites:
      #   Integration / TestAuthentication / TestMultiKeyAuth — require a live
      #     Ollama instance and on-disk api_keys.yaml setup; run locally only.
      #   -m "not rag" — RAG suite needs sentence-transformers + Chroma which
      #     are heavy to install on every CI run.
      # Coverage is reported but not yet enforced; the 2.0.0 bar is >=70%.
      # `set +e` lets the triage step run even on failure; the real exit code is
      # saved and re-asserted by the final "Enforce" step so job status is honest.
      - name: Run tests
        id: pytest
        run: |
          set +e
          pytest tests/ -v --tb=short \
            -k "not Integration and not TestAuthentication and not TestMultiKeyAuth" \
            -m "not rag" \
            --cov=api --cov-report=term --cov-report=xml \
            --junitxml=reports/junit.xml
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # Auto-triage: annotations + run-summary on every run; deduped issues ONLY
      # on trunk pushes -- dev (integration) and main (release). PR failures are
      # expected during iteration. Fork PRs get a read-only token, so issue
      # creation is detected + skipped by the CLI.
      # Uses built-in $GITHUB_EVENT_NAME / $GITHUB_REF (no ${{ }} in the shell).
      - name: Auto-triage failures
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENCLAVE_VERSION: ${{ github.sha }}
          TRIAGE_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          EMIT="annotations,summary"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && \
             { [ "$GITHUB_REF" = "refs/heads/dev" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
            EMIT="annotations,summary,issues"
          fi
          echo "Triage emit set: $EMIT"
          python -m triage ci --junit reports/junit.xml --emit "$EMIT"

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: Enforce test result
        if: always()
        run: exit ${{ steps.pytest.outputs.rc }}

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy

      - name: Check formatting (black)
        run: black --check api/ cli/ models/ || echo "::warning::Black formatting issues (non-blocking)"
        continue-on-error: true

      - name: Lint (flake8)
        run: flake8 api/ cli/ models/ --max-line-length=120 --extend-ignore=E501,W503 || echo "::warning::Flake8 issues (non-blocking)"
        continue-on-error: true

  release-readiness:
    # Guards the one shape the branch model cannot recover from silently: a
    # `dev -> main` release PR opened while `main` carries commits `dev` has
    # never seen. That happens after a hotfix merges into `main` and the
    # merge-forward back into `dev` is skipped -- merging the release PR would
    # then revert the hotfix. Fails the PR until `main` is merged into `dev`.
    #
    # Only runs on PRs targeting `main`; every other PR skips it entirely.
    name: Release readiness (dev is caught up with main)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check main has no commits missing from the PR head
        run: |
          git fetch --no-tags origin main
          # Commits on main that are not reachable from this PR's head.
          missing="$(git rev-list --count HEAD..origin/main)"
          if [ "$missing" -gt 0 ]; then
            echo "::error::main has $missing commit(s) this branch has not merged." \
                 "Merge main into ${GITHUB_HEAD_REF} (a plain merge, not a squash)" \
                 "before releasing, or the merge will revert them."
            echo "### Missing from this branch" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git log --oneline HEAD..origin/main >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "main is fully contained in ${GITHUB_HEAD_REF}."

  dmg-smoke:
    # Build the .app bundle on every PR + trunk push and verify it boots.
    # Skips final DMG packaging (saves ~1m); release.yml does the full DMG.
    # Catches regressions in scripts/build_mac.sh, desktop/app.py, and
    # api/main.py startup before they ship in a tagged release.
    name: macOS .app smoke build
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install librsvg (for icon generation)
        run: brew install librsvg

      - name: Regenerate icon assets
        run: |
          ./scripts/generate-icons.sh
          test -f assets/icons/icon.icns

      - name: Build .app bundle (skip DMG packaging)
        env:
          ENCLAVE_VERSION: ci-${{ github.sha }}
        run: |
          # Run build_mac.sh up through bundle verification, then stop short
          # of create-dmg/hdiutil to keep CI runtime tight.
          ./scripts/build_mac.sh 2>&1 | tee build.log || {
              echo "::error::build_mac.sh failed"; tail -50 build.log; exit 1;
          }
          test -d "dist/Enclave.app"
          test -f "dist/Enclave.app/Contents/MacOS/Enclave"
          test -f "dist/Enclave.app/Contents/Info.plist"

      - name: Verify version was stamped (not the legacy 0.1.0 placeholder)
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
              "dist/Enclave.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" \
              "dist/Enclave.app/Contents/Info.plist"

      - name: Boot the bundled API and probe UX routes
        run: |
          set -e
          BUNDLE="dist/Enclave.app/Contents/Resources"
          export PYTHONPATH="$BUNDLE"
          export ENABLE_API_AUTH=false
          export API_HOST=127.0.0.1
          export API_PORT=8765

          "$BUNDLE/venv/bin/python" -m api.main >api.log 2>&1 &
          API_PID=$!
          trap "kill $API_PID 2>/dev/null || true" EXIT

          for _ in $(seq 1 30); do
              if curl -sf -m 2 http://127.0.0.1:8765/health >/dev/null; then
                  break
              fi
              sleep 0.5
          done

          # Hard-fail if any of the user-facing surfaces 404 or refuse.
          for path in /health / /static/index.html /setup /api/info; do
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                  -m 5 "http://127.0.0.1:8765${path}")
              if [ "$code" != "200" ]; then
                  echo "::error::UX route ${path} returned HTTP ${code}"
                  echo "--- api log ---"; tail -80 api.log
                  exit 1
              fi
              echo "  ok  ${path} -> ${code}"
          done
