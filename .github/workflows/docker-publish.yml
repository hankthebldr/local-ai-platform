name: Docker Publish

# Publishes hankthebldrr/local-ai-platfrom to Docker Hub on every tag push
# and on every main merge (as :latest). Pushes to dev publish :edge and
# dev-<sha>, so :latest always means "most recent release". Manual dispatch supports a custom
# tag for hotfix builds.
#
# Required repository configuration:
#   DOCKERHUB_USERNAME  — repository VARIABLE (vars.*); not sensitive.
#                         Convention: keep account names + non-secret config
#                         in variables, not secrets. Set at:
#                         Settings → Secrets and variables → Actions → Variables
#                         If you accidentally put it in Secrets instead, the
#                         step below also falls back to secrets.DOCKERHUB_USERNAME
#                         so either configuration works.
#   DOCKERHUB_TOKEN     — repository SECRET. Docker Hub access token from
#                         https://hub.docker.com/settings/security
#
# Note the registry repo name: "local-ai-platfrom" (typo) is canonical;
# the operator created it that way and renaming would orphan published tags.

on:
  push:
    branches: [dev, main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom tag to publish (e.g. 1.1.2-rc1). Leave empty for auto."
        required: false

permissions:
  contents: read
  # Needed so the same job can also push to ghcr.io/hankthebldr/enclave
  # alongside the Docker Hub push. Read access on contents stays default.
  packages: write

jobs:
  publish:
    name: Build + push image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for `git describe` if we want a SHA-stamped tag

      - name: Determine tags
        id: meta
        # User-controllable input (workflow_dispatch.tag) routed through
        # env: to avoid script-injection — anything matching shell meta-
        # characters in the input would otherwise execute inside `run:`.
        # Format validation: must be alphanumeric + dot + dash + underscore.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Compute the version suffix(es) once, then expand into both
          # registry coordinates. GHCR uses lowercase, no-typo image name
          # ("enclave"); Docker Hub keeps its historical "local-ai-platfrom"
          # typo since renaming would orphan published tags.
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_TAG}" ]]; then
              if [[ ! "${INPUT_TAG}" =~ ^[a-zA-Z0-9._-]+$ ]]; then
                  echo "::error::Tag '${INPUT_TAG}' contains unsafe characters. Allowed: [a-zA-Z0-9._-]"
                  exit 1
              fi
              versions="${INPUT_TAG}"
              kind="manual"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              version="${GITHUB_REF#refs/tags/v}"
              versions="${version},latest"
              kind="tag"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              # A merge into main is a release. `latest` moves here, never on dev.
              short_sha="$(git rev-parse --short HEAD)"
              versions="main-${short_sha},latest"
              kind="main"
          else
              # dev: the rolling integration image. `edge` tracks the trunk so
              # `latest` keeps pointing at the most recent actual release.
              short_sha="$(git rev-parse --short HEAD)"
              versions="dev-${short_sha},edge"
              kind="dev"
          fi

          tag_list=""
          IFS=',' read -ra parts <<< "${versions}"
          for v in "${parts[@]}"; do
              if [ -n "${tag_list}" ]; then tag_list="${tag_list},"; fi
              tag_list="${tag_list}hankthebldrr/local-ai-platfrom:${v}"
              tag_list="${tag_list},ghcr.io/hankthebldr/enclave:${v}"
          done

          echo "tags=${tag_list}" >> "$GITHUB_OUTPUT"
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # Prefer the variable (`vars.*`) — that's where the operator
          # configured DOCKERHUB_USERNAME (non-sensitive account name).
          # Falls back to `secrets.*` so either setup works without
          # editing the workflow. Password is always from secrets.
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        # Mirror the same image to ghcr.io so users without a Docker Hub
        # account can pull from GitHub's registry. Uses the workflow's
        # GITHUB_TOKEN — no extra secrets required, just `packages: write`
        # at the job level (declared above).
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify both registry images are pullable
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # Probe one tag per registry so a misconfigured registry login
          # surfaces here instead of as a silent partial publish later.
          dockerhub_tag=$(echo "${ALL_TAGS}" | tr ',' '\n' | grep '^hankthebldrr/' | head -1)
          ghcr_tag=$(echo "${ALL_TAGS}" | tr ',' '\n' | grep '^ghcr.io/' | head -1)
          for t in "${dockerhub_tag}" "${ghcr_tag}"; do
              [ -n "${t}" ] || continue
              echo "→ inspecting ${t}"
              docker buildx imagetools inspect "${t}" | head -10
          done

      - name: Trivy vulnerability scan (non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hankthebldrr/local-ai-platfrom:latest
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"   # don't fail the publish — surface in logs

      - name: Notify (main push)
        if: steps.meta.outputs.kind == 'main'
        run: |
          echo "::notice::Published rolling 'latest' image to Docker Hub + GHCR. Pin to main-<sha> for immutable references."

      - name: Notify (dev push)
        if: steps.meta.outputs.kind == 'dev'
        run: |
          echo "::notice::Published rolling 'edge' image to Docker Hub + GHCR. Pin to dev-<sha> for immutable references. 'latest' still points at the most recent release."

      - name: Notify (tag push)
        if: steps.meta.outputs.kind == 'tag'
        run: |
          echo "::notice::Published versioned image to Docker Hub + GHCR. Production should pin to this tag, not :latest."
