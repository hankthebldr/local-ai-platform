[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "enclave"
dynamic = ["version"]
description = "Self-hosted LLM infrastructure with OpenAI-compatible API. CPU-optimized. Source-available."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Source-available — see LICENSE" }
authors = [{ name = "Henry Reed", email = "hankthebldr@gmail.com" }]
keywords = [
    "llm",
    "ollama",
    "openai-compatible",
    "self-hosted",
    "local-inference",
    "rag",
    "workflow-engine",
    "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# Runtime dependencies — mirrors setup/requirements-core.txt. Keep
# minimum versions identical so `pip install enclave` and the source
# install resolve to the same wheel set.
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "aiohttp>=3.9.1",
    "httpx>=0.25.2",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.1",
    "psutil>=5.9.7",
    "nvidia-ml-py>=12.535.0",
    "huggingface-hub>=0.20.2",
    "jinja2>=3.1",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.2",
    "beautifulsoup4>=4.12.0",
    "black>=23.12.1",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "ipython>=8.19.0",
]
desktop = [
    # macOS-only — installed by the DMG build pipeline. Listed here so
    # `pip install enclave[desktop]` reproduces the DMG runtime on a Mac.
    "py2app>=0.28",
    "pywebview>=4.4",
]
rag = [
    # Pull alongside core when you want the document QA pipeline.
    "chromadb>=0.4.22",
    "sentence-transformers>=2.5",
]

[project.urls]
Homepage = "https://hankthebldr.github.io/local-ai-platform/"
Repository = "https://github.com/hankthebldr/local-ai-platform"
Changelog = "https://github.com/hankthebldr/local-ai-platform/blob/master/CHANGELOG.md"
Documentation = "https://github.com/hankthebldr/local-ai-platform/wiki"
Issues = "https://github.com/hankthebldr/local-ai-platform/issues"

[project.scripts]
# `enclave` — single dispatcher: `enclave chat`, `enclave workflow run`,
# `enclave query`, `enclave api`. Keeps the public surface tight while
# the underlying modules stay as-is.
enclave = "cli.dispatcher:main"
# Direct entrypoints for users who prefer them or are scripting CI.
enclave-api = "api.main:run_server"
enclave-chat = "cli.chat:main"
enclave-query = "cli.query:main"
enclave-workflow = "cli.workflow:main"

# ── Hatch build configuration ─────────────────────────────────────────────

[tool.hatch.version]
# Single source of truth: api/__init__.py:__version__
path = "api/__init__.py"

[tool.hatch.build.targets.wheel]
# The wheel ships the FastAPI app, the workflow engine, the CLI tools,
# the model registry, and the failure-triage core (`triage/`). The triage
# package is imported lazily by the runtime error handler
# (api/exceptions.py:_dispatch_report); it MUST be packaged or opt-in error
# reporting silently no-ops in installed (pip/wheel) deployments. It does NOT
# ship the workflows/, agents/, or plugins/ directories — those are runtime
# resources the operator co-locates (see Wiki › Deployment). The DMG and
# Docker images include them automatically.
packages = ["api", "cli", "models", "triage"]

[tool.hatch.build.targets.sdist]
# Source distribution includes everything operators need to rebuild
# from scratch, EXCEPT generated artifacts, secrets, and IDE state.
include = [
    "api/",
    "cli/",
    "models/",
    "triage/",
    "agents/",
    "workflows/",
    "plugins/",
    "scripts/",
    "setup/",
    "desktop/",
    "docs/",
    "tests/",
    "MODELS.md",
    "README.md",
    "CHANGELOG.md",
    "CLAUDE.md",
    "Dockerfile",
    "docker-compose.yml",
    "docker-compose.webui.yml",
    "pyproject.toml",
    "run.sh",
    "stop.sh",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/.DS_Store",
    "venv/",
    "dist/",
    "build/",
    "data/",
    ".env",
    ".env.*",
    "Local AI Platform.app",
    "LocalAIPlatform.dmg",
]
