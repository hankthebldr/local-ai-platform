<!-- @dsCard group="Components" viewport="700x480" name="Workflow" subtitle="WorkflowNode · RoleChip · RunStatus · MetricStat — the composer atoms" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { background: var(--bg-deep); padding: 22px 24px; }
  .grid { display: flex; flex-direction: column; gap: 20px; }
  .sect { display: flex; flex-direction: column; gap: 10px; }
  .sect > .ds-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-faint); }
  .canvas { display: flex; align-items: center; gap: 38px; padding: 18px 22px; background:
    radial-gradient(circle at 1px 1px, var(--border-faint) 1px, transparent 0) 0 0 / 22px 22px,
    var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); position: relative; }
  .edge { position: absolute; height: 2px; background: var(--accent-dim); top: 50%; }
  .palette { display: flex; flex-direction: column; gap: 8px; max-width: 260px; }
  .strip { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .runs { display: flex; flex-direction: column; gap: 8px; max-width: 340px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { WorkflowNode, RoleChip, RunStatus, MetricStat } = window.EnclaveDesignSystem_47ed55;
const Ico = ({ n, ...p }) => <i data-lucide={n} {...p} />;

function Demo() {
  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
  return (
    <div className="grid">
      <div className="sect">
        <span className="ds-label">WorkflowNode — a DAG on the canvas</span>
        <div className="canvas">
          <div className="edge" style={{left:'21%',width:'10%'}} />
          <div className="edge" style={{left:'53%',width:'10%'}} />
          <WorkflowNode title="analyze" role="reasoning" model="dolphin-mixtral" status="success" outLinked />
          <WorkflowNode title="generate" role="coding" model="qwen2.5-coder" status="running" selected inLinked outLinked />
          <WorkflowNode title="validate" role="fast" model="llama3.2:3b" status="idle" inLinked outPort={false} />
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18}}>
        <div className="sect">
          <span className="ds-label">RoleChip — palette</span>
          <div className="palette">
            <RoleChip kind="reasoning" title="reasoning" desc="Deep analysis · 34B class" icon={<Ico n="brain" />} />
            <RoleChip kind="agent" title="xsiam-analyst" desc="Security triage persona" icon={<Ico n="bot" />} />
            <RoleChip kind="skill" title="concise-writer" desc="Tightens prose on trigger" icon={<Ico n="scissors" />} />
            <RoleChip kind="mcp" title="filesystem" desc="MCP · read/write tools" icon={<Ico n="server" />} />
          </div>
        </div>
        <div className="sect">
          <span className="ds-label">RunStatus</span>
          <div className="runs">
            <RunStatus state="running" current="generate" step={2} total={4} />
            <RunStatus state="success" step={4} total={4} />
            <RunStatus state="error" current="validate" step={3} total={4} />
            <RunStatus state="queued" total={4} showBar={false} />
          </div>
        </div>
      </div>

      <div className="sect">
        <span className="ds-label">MetricStat — system-impact strip</span>
        <div className="strip">
          <MetricStat label="CPU" value="34%" percent={34} bar />
          <MetricStat label="MEM" value="18.2 / 64 GB" percent={28} bar />
          <MetricStat label="Loaded" value="3" row />
          <MetricStat label="Throughput" value="47 t/s" color="var(--accent)" />
          <MetricStat label="Version" value="1.3.0" row />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
