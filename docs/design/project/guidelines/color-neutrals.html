<!-- @dsCard group="Colors" viewport="700x186" name="Neutrals — warm charcoal" subtitle="Green-grey undertone; never pure black, never blue slate" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--bg); padding: 20px; font-family: var(--font-mono); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .sw { border-radius: var(--radius-sm); border: 1px solid var(--border); overflow: hidden; }
  .chip { height: 44px; }
  .meta { padding: 5px 6px; background: var(--surface-card); }
  .name { font-size: 9px; color: var(--text); letter-spacing: .02em; }
  .hex { font-size: 8px; color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--ink-950)"></div><div class="meta"><div class="name">ink-950</div><div class="hex">canvas</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="meta"><div class="name">ink-900</div><div class="hex">surface</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-800)"></div><div class="meta"><div class="name">ink-800</div><div class="hex">card</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="meta"><div class="name">ink-700</div><div class="hex">overlay</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-600)"></div><div class="meta"><div class="name">ink-600</div><div class="hex">border</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="meta"><div class="name">ink-500</div><div class="hex">border+</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-400)"></div><div class="meta"><div class="name">ink-400</div><div class="hex">faint</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-300)"></div><div class="meta"><div class="name">ink-300</div><div class="hex">muted</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-200)"></div><div class="meta"><div class="name">ink-200</div><div class="hex">dim</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-150)"></div><div class="meta"><div class="name">ink-150</div><div class="hex">2ndary</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-100)"></div><div class="meta"><div class="name">ink-100</div><div class="hex">high</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-50)"></div><div class="meta"><div class="name">ink-50</div><div class="hex">text</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-0)"></div><div class="meta"><div class="name">ink-0</div><div class="hex">heading</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-990)"></div><div class="meta"><div class="name">ink-990</div><div class="hex">void</div></div></div>
  </div>
</body>
</html>
