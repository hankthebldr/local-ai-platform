<!-- @dsCard group="Type" viewport="700x300" name="Mono label & statistics — the signature" subtitle="JetBrains Mono caps labels + live telemetry: the keystone of the operator UI" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--bg-deep); padding: 18px 20px; font-family: var(--font-mono); }
  .sec { margin-bottom: 16px; }
  .seclab { font-size: 8px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 10px; }

  /* label variants */
  .labels { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .l-tick, .l-plain, .l-count, .l-live { font-size: var(--text-xs); font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--text-muted); display: inline-flex; align-items: center; gap: 8px; }
  .l-tick::before { content: ""; width: 14px; height: 1px; background: var(--accent); }
  .l-count .n { font-size: 9px; color: var(--accent); background: var(--accent-ghost); border: 1px solid var(--accent-dim); border-radius: var(--radius-pill); padding: 1px 7px; letter-spacing: .05em; }
  .l-live { color: var(--accent); }
  .l-live .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: ds-pip-pulse 2.4s var(--ease-out) infinite; }

  /* telemetry readout */
  .telem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat .k { font-size: 8px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-muted); }
  .stat .vrow { display: flex; align-items: baseline; gap: 5px; }
  .stat .v { font-size: 22px; font-weight: 600; color: var(--c, var(--text)); line-height: 1; letter-spacing: -.02em; }
  .stat .u { font-size: 9px; color: var(--text-muted); }
  .stat .trend { font-size: 8px; color: var(--c, var(--accent)); display: inline-flex; align-items: center; gap: 2px; }
  .stat .bar { height: 3px; background: var(--ink-700); border-radius: var(--radius-pill); overflow: hidden; margin-top: 2px; }
  .stat .bar > i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: var(--radius-pill); }
  .spark { display: block; margin-top: 2px; }

  /* metadata key-values */
  .kv { display: grid; grid-template-columns: repeat(3, auto 1fr); gap: 6px 12px; font-size: var(--text-sm); margin-top: 4px; }
  .kv .k { color: var(--text-muted); letter-spacing: .12em; text-transform: uppercase; font-size: 8px; align-self: center; }
  .kv .v { color: var(--text); }
  .kv .v .ac { color: var(--accent); }
</style>
</head>
<body>
  <div class="sec">
    <div class="seclab">Label variants</div>
    <div class="labels">
      <span class="l-tick">System Prompt</span>
      <span class="l-plain">Workflow ID</span>
      <span class="l-count">Loaded Models <span class="n">3</span></span>
      <span class="l-live"><span class="pip"></span>Running</span>
    </div>
  </div>

  <div class="sec">
    <div class="seclab">Live telemetry — the statistics keystone</div>
    <div class="telem">
      <div class="stat" style="--c:var(--accent)">
        <span class="k">Throughput</span>
        <span class="vrow"><span class="v">47</span><span class="u">tok/s</span><span class="trend">▲ 6%</span></span>
        <svg class="spark" width="100%" height="20" viewBox="0 0 120 20" preserveAspectRatio="none"><polyline points="0,15 15,13 30,16 45,10 60,11 75,7 90,9 105,4 120,5" fill="none" stroke="var(--accent)" stroke-width="1.4" opacity="0.8"/></svg>
      </div>
      <div class="stat" style="--c:var(--accent)">
        <span class="k">CPU</span>
        <span class="vrow"><span class="v">34</span><span class="u">%</span></span>
        <span class="bar"><i style="width:34%"></i></span>
        <span class="k" style="color:var(--text-faint)">16 cores · 7945HX</span>
      </div>
      <div class="stat" style="--c:var(--warn)">
        <span class="k">Memory</span>
        <span class="vrow"><span class="v">28</span><span class="u">%</span></span>
        <span class="bar"><i style="width:28%"></i></span>
        <span class="k" style="color:var(--text-faint)">18.2 / 64 GB</span>
      </div>
      <div class="stat" style="--c:var(--emerald-400)">
        <span class="k">Latency p50</span>
        <span class="vrow"><span class="v">214</span><span class="u">ms</span><span class="trend">▼ 12%</span></span>
        <svg class="spark" width="100%" height="20" viewBox="0 0 120 20" preserveAspectRatio="none"><polyline points="0,5 15,7 30,6 45,9 60,8 75,11 90,10 105,13 120,12" fill="none" stroke="var(--emerald-400)" stroke-width="1.4" opacity="0.8"/></svg>
      </div>
    </div>
  </div>

  <div class="kv">
    <span class="k">Run</span><span class="v"><span class="ac">run-7f3a</span></span>
    <span class="k">Steps</span><span class="v">4 / 4</span>
    <span class="k">Backend</span><span class="v">ollama@0.23.4</span>
    <span class="k">Quant</span><span class="v">Q4_K_M</span>
    <span class="k">Model</span><span class="v">dolphin-mixtral</span>
    <span class="k">Telemetry</span><span class="v" style="color:var(--success)">off</span>
  </div>
</body>
</html>
