<!-- @dsCard group="Colors" viewport="700x150" name="Ember — Ubuntu-grub warmth" subtitle="The warm spark. Use sparingly: co-mark, highlight, uncensored" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--bg); padding: 20px; font-family: var(--font-mono); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .sw { flex: 1; border-radius: var(--radius-sm); border: 1px solid var(--border); overflow: hidden; }
  .chip { height: 56px; }
  .meta { padding: 6px 8px; background: var(--surface-card); }
  .name { font-size: 10px; color: var(--text); letter-spacing: .04em; }
  .hex { font-size: 9px; color: var(--text-muted); text-transform: uppercase; }
  .note { flex: 1.4; display: flex; align-items: center; padding: 0 14px; font-family: var(--font-sans);
          font-size: 11px; color: var(--text-dim); border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); }
  .note b { color: var(--accent-warm); font-weight: 600; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ember-600)"></div><div class="meta"><div class="name">600</div><div class="hex">#B45F2C</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ember-500)"></div><div class="meta"><div class="name">500</div><div class="hex">#CE7438</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ember-400)"></div><div class="meta"><div class="name">400 · warm</div><div class="hex">#E08A4C</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ember-300)"></div><div class="meta"><div class="name">300</div><div class="hex">#EDA871</div></div></div>
    <div class="note">Ember is the one warm note in a cool palette — like Ubuntu's terminal aubergine glow. <b>≤ 5% of any screen.</b></div>
  </div>
</body>
</html>
