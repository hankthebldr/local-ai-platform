<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--bg-deep); padding: 16px 18px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  figure { margin: 0; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; background: var(--bg); }
  figure img { width: 100%; height: 88px; object-fit: cover; display: block; }
  figcaption { font-family: var(--font-mono); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); padding: 7px 9px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
  <div class="grid">
    <figure><img src="../assets/illustrations/art-swarm.svg" alt="Agent swarm"><figcaption>Agent swarm</figcaption></figure>
    <figure><img src="../assets/illustrations/art-flow.svg" alt="Context flow"><figcaption>Context flow</figcaption></figure>
    <figure><img src="../assets/illustrations/art-constellation.svg" alt="Knowledge graph"><figcaption>Knowledge graph</figcaption></figure>
    <figure><img src="../assets/illustrations/art-fanout.svg" alt="Parallel dispatch"><figcaption>Parallel dispatch</figcaption></figure>
    <figure><img src="../assets/illustrations/art-accelerate.svg" alt="Acceleration"><figcaption>Acceleration</figcaption></figure>
    <figure><img src="../assets/illustrations/art-plot.svg" alt="Plotting trend"><figcaption>Plotting · trend</figcaption></figure>
    <figure><img src="../assets/illustrations/art-connect.svg" alt="Connecting workflows"><figcaption>Connecting</figcaption></figure>
    <figure><img src="../assets/illustrations/art-pipeline.svg" alt="Throughput ramp"><figcaption>Throughput ramp</figcaption></figure>
    <figure><img src="../assets/illustrations/art-stream.svg" alt="Token stream"><figcaption>Token stream</figcaption></figure>
    <figure><img src="../assets/illustrations/art-mesh.svg" alt="Inference mesh"><figcaption>Inference mesh</figcaption></figure>
    <figure><img src="../assets/illustrations/art-orbit.svg" alt="Model orbit"><figcaption>Model orbit</figcaption></figure>
    <figure><img src="../assets/illustrations/art-pulse.svg" alt="Inference pulse"><figcaption>Inference pulse</figcaption></figure>
  </div>
</body>
</html>
