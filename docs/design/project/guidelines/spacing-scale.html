<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid; dense at the low end" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--bg); padding: 22px 24px; font-family: var(--font-mono); }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--accent-ghost); border: 1px solid var(--accent-dim); border-radius: var(--radius-xs); }
  .lab { font-size: 9px; color: var(--text-muted); }
  .px { font-size: 8px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="width:4px;height:4px"></div><div class="lab">2</div><div class="px">4px</div></div>
    <div class="item"><div class="bar" style="width:8px;height:8px"></div><div class="lab">4</div><div class="px">8px</div></div>
    <div class="item"><div class="bar" style="width:12px;height:12px"></div><div class="lab">5</div><div class="px">12px</div></div>
    <div class="item"><div class="bar" style="width:16px;height:16px"></div><div class="lab">6</div><div class="px">16px</div></div>
    <div class="item"><div class="bar" style="width:20px;height:20px"></div><div class="lab">7</div><div class="px">20px</div></div>
    <div class="item"><div class="bar" style="width:24px;height:24px"></div><div class="lab">8</div><div class="px">24px</div></div>
    <div class="item"><div class="bar" style="width:32px;height:32px"></div><div class="lab">9</div><div class="px">32px</div></div>
    <div class="item"><div class="bar" style="width:40px;height:40px"></div><div class="lab">10</div><div class="px">40px</div></div>
    <div class="item"><div class="bar" style="width:48px;height:48px"></div><div class="lab">11</div><div class="px">48px</div></div>
    <div class="item"><div class="bar" style="width:64px;height:64px"></div><div class="lab">12</div><div class="px">64px</div></div>
  </div>
</body>
</html>
