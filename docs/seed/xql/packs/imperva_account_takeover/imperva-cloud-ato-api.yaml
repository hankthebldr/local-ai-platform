        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "Retrieve the suspicious successful unique users for the requested\
            \ time span, including the same for the previous time span"
          schema:
            $ref: "#/definitions/UsersStats"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
  /v2/sites/{siteId}/timeline:
    post:
      tags:
      - "Timeline"
      summary: "Get the login timeline for a site."
      description: "Pass an endpoint id in order to get the timeline just for that\
        \ one.\nIf you don't pass an endpoint id, all configured ids will be sent\
        \ as one \"TOTAL\" (summed together).\nA login timeline represents ongoing\
        \ login requests made to your site over a time period. Each data point represents\
        \ the number of logins attempted for that time bucket (each 5 minutes)."
      operationId: "getLoginsTimeline"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Specify the time selection"
        required: true
        schema:
          $ref: "#/definitions/StatsRequest"
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      - name: "endpointId"
        in: "query"
        required: false
        type: "string"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "Retrieve the login requests timeline"
          schema:
            $ref: "#/definitions/LoginsTimeline"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
securityDefinitions:
  api_id:
    description: "An API ID created and managed in the Imperva Cloud Security Console\
      \ and used for authentication"
    type: "apiKey"
    name: "x-API-Id"
    in: "header"
  api_key:
    description: "An API key created and managed in the Imperva Cloud Security Console\
      \ and used for authentication"
    type: "apiKey"
    name: "x-API-Key"
    in: "header"
definitions:
  AllStats:
    type: "object"
    properties:
      users:
        description: "Total number of unique users per type for the the requested\
          \ time span."
        $ref: "#/definitions/AllUserStats"
      top:
        description: "Top unique sources per risk level for the the requested time\
          \ span."
        $ref: "#/definitions/TopStats"
  AllUserStats:
    type: "object"
    properties:
      leaked:
        description: "User stats of of those using leaked credentials."
        $ref: "#/definitions/UsersStats"
      aggregator:
        description: "User stats of of those classified as aggregators."
        $ref: "#/definitions/UsersStats"
      suspiciousSuccessful:
        description: "User stats of of those that performed successful login requests\
          \ that were classified as suspicious as well."
        $ref: "#/definitions/UsersStats"
      likelyLeaked:
        description: "User stats of of those using likely-leaked credentials."
        $ref: "#/definitions/UsersStats"
  AllowlistIp:
    type: "object"
    required:
    - "ip"
    properties:
      ip:
        type: "string"
        example: "192.10.20.0"
        description: "IP address to exclude. This will be either an IPv4 (e.g. 50.3.183.2)\
          \ or normalized IPv6 representation (e.g. 2001:db8:0:0:1:0:0:1)."
      mask:
        type: "string"
        example: "24"
        description: "[Optional] IP subnet mask to use for excluding a range of IPs.\
          \ This is the number of bits to use from the IP address as a subnet mask\
          \ to apply on the source IP of incoming traffic."
      updated:
        type: "integer"
        format: "int64"
        example: 1632530998076
        description: "Timestamp, in UNIX Epoch milliseconds, of the latest update\
          \ of this entry."
      desc:
        type: "string"
        example: "My own IP to always allow"
        description: "Description of the IP/subnet."
  DeviceStats:
    type: "object"
    properties:
      failedLogins:
        type: "integer"
        format: "int64"
        description: "Failed logins in last 24 hours."
      fingerprint:
        type: "string"
        description: "Client fingerprint."
      leakedCredentials:
        type: "integer"
        format: "int64"
        description: "Number of leaked credentials used to login in last 24 hours."
      risk:
        type: "string"
        description: "Probability that this event was part of an attack, as computed\
          \ post-factum."
        enum:
        - "LOW"
        - "MEDIUM"
        - "HIGH"
      successfulLogins:
        type: "integer"
        format: "int64"
        description: "Successful logins in last 24 hours."
  Endpoints:
    type: "object"
    properties:
      endpointId:
        type: "string"
        description: "The endpoint ID"
      url:
        type: "string"
        description: "URL configured for this endpoint"
      usernameParameter:
        type: "string"
        description: "Username parameter configured for this endpoint"
      passwordParameter:
        type: "string"
        description: "Password parameter configured for this endpoint"
  Evaluation:
    type: "object"
    properties:
      riskFactors:
        type: "array"
        description: "Additional risk factors contributing to the total risk score."
        uniqueItems: true
        items:
          type: "string"
      recordType:
        type: "string"
        description: "Type of login evidence."
      reputation:
        type: "array"
        description: "IP reputation as classified by the proxy."
        uniqueItems: true
        items:
          type: "string"
  Evidence:
    type: "object"
    properties:
      request:
        $ref: "#/definitions/Request"
      deviceStats:
        $ref: "#/definitions/DeviceStats"
      evaluation:
        $ref: "#/definitions/Evaluation"
  EvidenceRequest:
    type: "object"
    properties:
      piiPassword:
        type: "string"
        example: "password"
        description: "Specify the PII password used to encrypt login information.\
          \ If not specified, the user names will be hashed or encrypted."
      endpointId:
        type: "string"
        example: "1234567890"
        description: "Optional: Specify the endpoint ID you would like to fetch information\
          \ for. If not specified, all endpoints would be used. If no endpoint ID\
          \ is supplied, the default will be all endpoints."
      startTime:
        type: "integer"
        format: "int64"
        example: 1644000700000
        description: "Specify the timestamp, in UNIX Epoch milliseconds, from which\
          \ events are retrieved."
      endTime:
        type: "integer"
        format: "int64"
        example: 1644000702000
        description: "Specify the timestamp, in UNIX Epoch milliseconds, to which\
          \ events are retrieved."
      rangeHours:
        type: "integer"
        format: "int64"
        example: 24
        description: "Specify the range, in hours, for which events are retrieved.\
          \ If specified, range will be used. If not specified, startTime and endTime\
          \ will be used instead."
  LikelyLeakedEvidence:
    type: "object"
    properties:
      user:
        type: "string"
        description: "The username of the user sending the login request. If the PII\
          \ password was specified, the username is returned. If the PII password\
          \ was not specified or does not match our record, a hashed/encrypted form\
          \ of the username is returned."
        readOnly: true
      ip:
        type: "string"
        description: "IP address from which the login attempt was made. This will\
          \ be either an IPv4 (e.g. 50.3.183.2) or normalized IPv6 representation\
          \ (e.g. 2001:db8:0:0:1:0:0:1)."
        readOnly: true
      timestamp:
        type: "integer"
        format: "int64"
        description: "Timestamp, in UNIX Epoch milliseconds, of the login event."
        readOnly: true
  LoginEvent:
    type: "object"
    properties:
      ip:
        type: "string"
        description: "IP address from which the login attempt was made. This will\
          \ be either an IPv4 (e.g. 50.3.183.2) or normalized IPv6 representation\
          \ (e.g. 2001:db8:0:0:1:0:0:1)."
      risk:
        type: "string"
        description: "Probability that this event was part of an attack, as computed\
          \ post-factum."
        enum:
        - "LOW"
        - "MEDIUM"
        - "HIGH"
      time:
        type: "integer"
        format: "int64"
        description: "Timestamp, in UNIX Epoch milliseconds, of the login event."
      user:
        type: "string"
        description: "The username, if the PII password was specified, or a hashed/encrypted\
          \ form of the username if the PII password was not specified or does not\
          \ match."
      type:
        type: "string"
        description: "Reason for the presence of the login event in the report."
        enum:
        - "LEAKED"
        - "COMPROMISED"
      path:
        type: "string"
        description: "The login request endpoint path."
      referrer:
        type: "string"
        description: "The URL of the referring page."
      endpointId:
        type: "string"
        description: "The endpoint ID associated with the login request."
  LoginsTimeline:
    type: "object"
    required:
    - "timeline"
    properties:
      startTime:
        type: "integer"
        format: "int64"
        example: 1673624384997
        description: "Starting timestamp in UNIX Epoch milliseconds from which this\
          \ timeline data begins."
      intervalMs:
        type: "integer"
        format: "int64"
        example: 300000
        description: "Time interval between data points in milliseconds."
      endpointId:
        type: "string"
        example: "1616877031"
        description: "The endpoint ID related to this login timeline."
      timeline:
        type: "object"
        additionalProperties:
          $ref: "#/definitions/RequestTimeline"
  MitigationRequest:
    type: "object"
    properties:
      endpointId:
        type: "string"
        description: "Endpoint ID associated with this request."
        readOnly: true
      lowAction:
        type: "string"
        description: "Mitigation action configured for low risk requests - in UPPER\
          \ CASE."
        readOnly: true
        enum:
        - "NONE"
        - "CAPTCHA"
        - "BLOCK"
        - "TARPIT"
      mediumAction:
        type: "string"
        description: "Mitigation action configured for medium risk requests - in UPPER\
          \ CASE."
        readOnly: true
        enum:
        - "NONE"
        - "CAPTCHA"
        - "BLOCK"
        - "TARPIT"
      highAction:
        type: "string"
        description: "Mitigation action configured for high risk requests - in UPPER\
          \ CASE."
        readOnly: true
        enum:
        - "NONE"
        - "CAPTCHA"
        - "BLOCK"
        - "TARPIT"
  PiiConfigPassword:
    type: "object"
    properties:
      current:
        type: "string"
        description: "Current password."
      proposed:
        type: "string"
        description: "Proposed password."
  ReportRequest:
    type: "object"
    properties:
      startTime:
        type: "integer"
        format: "int64"
        description: "Specify the timestamp, in UNIX Epoch milliseconds, from which\
          \ events are retrieved."
      limit:
        type: "integer"
        format: "int32"
        example: 10
        description: "Specify the maximum number of events in the report (maximum\
          \ 10000, default 10000)."
      piiPassword:
        type: "string"
        description: "Specify the PII password used to encrypt login information.\
          \ If not specified, the user names will be hashed or encrypted in the response."
      endpointId:
        type: "string"
        description: "Optional: Specify the endpoint ID to fetch information for.\
          \ If no endpoint ID is specified, details of all endpoints defined for the\
          \ website are returned."
  Request:
    type: "object"
    properties:
      user:
        type: "string"
        description: "The username of the user sending the login request. If the PII\
          \ password was specified, the username is returned. If the PII password\
          \ was not specified or does not match our record, a hashed/encrypted form\
          \ of the username is returned."
      client:
        type: "string"
        description: "The client application used to send the request."
      declaredClient:
        type: "string"
        description: "The client application used to send the request, according to\
          \ the declaration in the UserAgent HTTP header."
      clients:
        type: "array"
        description: "All client applications used to send requests during the specified\
          \ timeframe."
        uniqueItems: true
        items:
          type: "string"
      declaredClients:
        type: "array"
        description: "All client applications used to send requests during the specified\
          \ timeframe, according to the declaration in the UserAgent HTTP header."
        uniqueItems: true
        items:
          type: "string"
      requestId:
        type: "integer"
        format: "int64"
        description: "A unique identifier assigned to the request."
      sessionId:
        type: "integer"
        format: "int64"
        description: "A unique identifier assigned to the session."
      ip:
        type: "string"
        description: "IP address from which the login attempt was made. This will\
          \ be either an IPv4 (e.g. 50.3.183.2) or normalized IPv6 representation\
          \ (e.g. 2001:db8:0:0:1:0:0:1)."
      timestamp:
        type: "integer"
        format: "int64"
        description: "Timestamp, in UNIX Epoch milliseconds, of the login event."
      path:
        type: "string"
        description: "The login request endpoint path."
      country:
        type: "string"
        description: "Country code where the login attempt was made."
      referrer:
        type: "string"
        description: "The URL of the referring page."
      userAgent:
        type: "string"
        description: "The user agent of the login event."
  RequestTimeline:
    type: "object"
    properties:
      total:
        type: "integer"
        format: "int64"
        example: 7944
        description: "Total requests for the current time span selection."
      prevTotal:
        type: "integer"
        format: "int64"
        example: 4532
        description: "Total requests for the previous time span selection."
      data:
        type: "array"
        example: "[5, 1, 0, 0, 0, 75, 2, 1, 0, 0]"
        description: "List where every value is the count of login requests for that\
          \ time interval."
        items:
          type: "integer"
          format: "int64"
  SiteStatus:
    type: "object"
    properties:
      siteId:
        type: "integer"
        format: "int64"
        description: "The Imperva website ID"
      websiteName:
        type: "string"
        example: "mysite.com"
        description: "The site name (URL)"
      isMitigationOn:
        type: "boolean"
        example: true
        description: "The site mitigation status (true/false)"
  StatsRequest:
    type: "object"
    properties:
      startTime:
        type: "integer"
        format: "int64"
        example: 1644000700000
        description: "Specify the timestamp, in UNIX Epoch milliseconds, from which\
          \ events are retrieved."
      endTime:
        type: "integer"
        format: "int64"
        example: 1644000702000
        description: "Specify the timestamp, in UNIX Epoch milliseconds, to which\
          \ events are retrieved."
      rangeHours:
        type: "integer"
        format: "int64"
        example: 24
        description: "Specify the range, in hours, for which events are retrieved.\
          \ If specified, range will be used. If not specified, startTime and endTime\
          \ will be used instead."
  StreamingOutput:
    type: "object"
  SuspiciousSuccessfulEvidence:
    type: "object"
    properties:
      likelyLeaked:
        type: "string"
      aggregators:
        type: "string"
      suspiciousSuccessful:
        type: "string"
      mitigated:
        type: "string"
      leaked:
        type: "string"
  TopSource:
    type: "object"
    properties:
      none:
        type: "object"
        description: "Top source by type mapped to a count of requests with risk level\
          \ \"none\"."
        additionalProperties:
          type: "integer"
          format: "int64"
      low:
        type: "object"
        description: "Top source by type mapped to a count of requests with risk level\
          \ \"low\"."
        additionalProperties:
          type: "integer"
          format: "int64"
      medium:
        type: "object"
        description: "Top source by type mapped to a count of requests with risk level\
          \ \"medium\"."
        additionalProperties:
          type: "integer"
          format: "int64"
      high:
        type: "object"
        description: "Top source by type mapped to a count of requests with risk level\
          \ \"high\"."
        additionalProperties:
          type: "integer"
          format: "int64"
  TopStats:
    type: "object"
    properties:
      client:
        description: "Top clients performing login requests."
        $ref: "#/definitions/TopSource"
      country:
        description: "Top countries performing login requests."
        $ref: "#/definitions/TopSource"
      ip:
        description: "Top IPs performing login requests."
        $ref: "#/definitions/TopSource"
      ipFingerprint:
        description: "Top IP+Fingerprint combinations performing login requests."
        $ref: "#/definitions/TopSource"
      reputation:
        description: "Top reputations performing login requests."
        $ref: "#/definitions/TopSource"
  UsersStats:
    type: "object"
    properties:
      currentTotal:
        type: "integer"
        format: "int32"
        description: "Total number of unique users for the the requested time span,\
          \ as passed in the API model \"StatsRequest\""
      prevTotal:
        type: "integer"
        format: "int32"
        description: "Total number of unique users for the previous time span, as\
          \ passed in the API model \"StatsRequest\" (e.g. if time specified in API\
          \ is 24 hours, then this will return for the previous 24 hours."
