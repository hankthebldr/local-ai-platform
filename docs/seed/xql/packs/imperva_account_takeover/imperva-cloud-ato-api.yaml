---
swagger: "2.0"
info:
  description: "This is the API documentation for Imperva Account Takeover Protection.\
    \ ATO detects and mitigates account takeover attempts, protecting your web applications\
    \ against volumetric and low and slow ATO attacks. For the full feature documentation,\
    \ see https://docs.imperva.com/bundle/account-takeover."
  version: "2.0.0"
  title: "Account Takeover Protection API"
host: "api.imperva.com"
basePath: "/ato"
tags:
- name: "Configuration"
- name: "Evidence"
- name: "General"
- name: "Mitigation"
- name: "PiiPassword"
- name: "Statistics"
- name: "Timeline"
- name: "TopSources"
- name: "Users"
schemes:
- "https"
security:
- api_id: []
  api_key: []
paths:
  /v2/sites:
    get:
      tags:
      - "Configuration"
      summary: "Retrieve all onboarded sites with their mitigation status."
      description: "Retrieve a list of all onboarded sites for the account ID. Each\
        \ site will include the Imperva website ID, site name, and mitigation status.\
        \ If the API key used is for a parent account, and the website belongs to\
        \ a sub account, the caid of the sub account must be specified."
      operationId: "getOnboardedSitesWithMitigationStatus"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      responses:
        200:
          description: "List of onboarded sites with their mitigation status."
          schema:
            type: "array"
            items:
              $ref: "#/definitions/SiteStatus"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
  /v2/sites/{siteId}/allowlist:
    get:
      tags:
      - "General"
      summary: "Retrieve the allowlist for a specific site"
      description: "Retrieve the list of IPs and subnets excluded from traffic mitigation\
        \ by ATO Protection.\nAll traffic from these IPs will not be mitigated."
      operationId: "getAllowList"
      parameters:
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "List of the IPs and subnets to exclude from mitigation"
          schema:
            $ref: "#/definitions/AllowlistIp"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
    post:
      tags:
      - "General"
      summary: "Update the allowlist for a specific site"
      description: "Update the list of IPs and subnets excluded from traffic mitigation\
        \ by ATO Protection.\nAll traffic from these IPs will not be mitigated.\n\
        The input should be a comma separated JSON list containing the IPs to add\
        \ to the site allowlist.\nEach allowed IP object can have a mask property\
        \ to be applied to that IP and allow that whole subnet.\nFor example:\n[{\"\
        ip\":\"192.20.1.1\",\"desc\":\"My own IP\"},{\"ip\":\"15.5.0.0\",\"mask\"\
        :\"16\",\"desc\":\"Office subnet\"},{\"ip\":\"20.1.1.0\",\"mask\":\"24\",\"\
        desc\":\"Home subnet\"}]"
      operationId: "addToAllowList"
      parameters:
      - in: "body"
        name: "body"
        description: "List of IPs/subnets"
        required: true
        schema:
          type: "array"
          items:
            $ref: "#/definitions/AllowlistIp"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "OK"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
    put:
      tags:
      - "General"
      summary: "Overwrite the allowlist for a specific site"
      description: "Overwrite the list of IPs and subnets excluded from traffic mitigation\
        \ by ATO Protection.\nTHIS CALL WILL REPLACE THE EXISTING LIST.\nAll traffic\
        \ from these IPs will not be mitigated.\nThe input should be a comma separated\
        \ JSON list containing all the IPs in the allowlist for the site.\nEach allowed\
        \ IP object can have a mask property to be applied to that IP and allow that\
        \ whole subnet."
      operationId: "setAllowList"
      parameters:
      - in: "body"
        name: "body"
        description: "Complete list of IPs/subnets"
        required: true
        schema:
          type: "array"
          items:
            $ref: "#/definitions/AllowlistIp"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "OK"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
    delete:
      tags:
      - "General"
      summary: "Remove IPs from the allowlist for a specific site"
      description: "Remove the list of IPs and subnets from the current allowlist\
        \ configuration of the site.\nMatching the IPs and subnets will be done by\
        \ comparing the 'ip' and 'mask' fields of the entries.\nFor example:\n[{\"\
        ip\":\"192.20.1.1\"},{\"ip\":\"15.5.0.0\",\"mask\":\"16\"}]"
      operationId: "removeFromAllowList"
      parameters:
      - in: "body"
        name: "body"
        description: "List of IPs/subnets to remove"
        required: true
        schema:
          type: "array"
          items:
            $ref: "#/definitions/AllowlistIp"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "OK"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
  /v2/sites/{siteId}/endpoint/{endpointId}:
    delete:
      tags:
      - "Configuration"
      summary: "Delete an endpoint for this website"
      description: "Delete the specified endpoint from the specified website.If the\
        \ API key used is for a parent account, and the website belongs to a sub account,\
        \ the caid of the sub account must be specified."
      operationId: "deleteEndpoint"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      - name: "endpointId"
        in: "path"
        description: "The endpoint ID to delete"
        required: true
        type: "string"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "OK"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
  /v2/sites/{siteId}/endpoints:
    get:
      tags:
      - "Configuration"
      summary: "Retrieve all the onboarded login endpoints for this website"
      description: "Retrieve a list of all onboarded login endpoints for your website.\
        \ Each endpoint will include its id, url, username and password parameters.\
        \ If the API key used is for a parent account, and the website belongs to\
        \ a sub account, the caid of the sub account must be specified."
      operationId: "getEndpoints"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "List of onboarded endpoints, each includes url, id, username\
            \ and password parameters"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Endpoints"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
  /v2/sites/{siteId}/mitigation:
    get:
      tags:
      - "Mitigation"
      summary: "Get the mitigation configuration for a specific site."
      description: "Pass a comma-separated string of endpoint ids in order to get\
        \ the mitigation configuration just for those ones. If not passed, this API\
        \ will retrieve the mitigation configuration for all endpoints"
      operationId: "getMitigationConfig"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      - name: "endpointIds"
        in: "query"
        description: "Comma-separated list of endpoint ids"
        required: false
        type: "string"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "Retrieve a list of endpoint IDs with their mitigation configuration,\
            \ e.g. [\n    {\n        \"endpointId\": \"764337755\",\n        \"lowAction\"\
            : \"NONE\",\n        \"mediumAction\": \"NONE\",\n        \"highAction\"\
            : \"BLOCK\"\n    },\n    {\n        \"endpointId\": \"1429179364\",\n\
            \        \"lowAction\": \"NONE\",\n        \"mediumAction\": \"CAPTCHA\"\
            ,\n        \"highAction\": \"CAPTCHA\"\n    }\n]"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/MitigationRequest"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
    post:
      tags:
      - "Mitigation"
      summary: "Change the mitigation configuration for a specific site and endpoint.\
        \ The actions (low, medium, high) should all be in UPPER CASE."
      description: "Possible values for actions are: NONE, CAPTCHA, BLOCK, TARPIT."
      operationId: "setMitigationConfigForEndpoints"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Specify endpoint ID and mitigation actions list"
        required: true
        schema:
          type: "array"
          items:
            $ref: "#/definitions/MitigationRequest"
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "OK"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
  /v2/sites/{siteId}/onboard/copy-to/{target-site-id}:
    post:
      tags:
      - "Configuration"
      summary: "Copy a single login endpoint, or all of them, from the \"source\"\
        \ website to the \"target\" website under the same account ID"
      description: "Both sites must be under the same account ID (no sub-accounts\
        \ support yet). In addition, mitigation settings are not copied."
      operationId: "copyEndpointConfigurationFromSiteToAnotherSite"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      - name: "endpointId"
        in: "query"
        description: "Optional: pass an endpoint ID to copy, if none passed all endpoints\
          \ will be copied"
        required: false
        type: "string"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the \"source\" website (the website we copy\
          \ from)"
        required: true
        type: "integer"
        format: "int64"
      - name: "target-site-id"
        in: "path"
        description: "The Imperva ID of the \"target\" website (the website we want\
          \ to copy the endpoint config to)"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "OK"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
  /v2/sites/{siteId}/pii-password:
    post:
      tags:
      - "PiiPassword"
      summary: "Update the PII password"
      description: "Update the PII password for the current account. If the API key\
        \ used is for a parent account, and the website belongs to a sub account,\
        \ the caid of the sub account must be specified."
      operationId: "setPiiPassword"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Pii Password to update"
        required: true
        schema:
          $ref: "#/definitions/PiiConfigPassword"
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "OK"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
    delete:
      tags:
      - "PiiPassword"
      summary: "Reset the PII password"
      description: "Reset the PII password for the current account. This will delete\
        \ the currently configured PII password and you will have to configure a new\
        \ one before being able to see plaintext usernames. If the API key used is\
        \ for a parent account, and the website belongs to a sub account, the caid\
        \ of the sub account must be specified."
      operationId: "deletePiiPassword"
      produces:
      - "application/json"
      parameters:
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        204:
          description: "No Content"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
  /v2/sites/{siteId}/report/evidence:
    post:
      tags:
      - "Evidence"
      summary: "Retrieve report of all user logins"
      description: "Retrieve the list of successful login events that used publicly\
        \ available leaked credentials. If the API key used is for a parent account,\
        \ and the website belongs to a sub account, the caid of the sub account must\
        \ be specified."
      operationId: "getAllEvidence"
      produces:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Specify the time selection and/or endpoint ID"
        required: true
        schema:
          $ref: "#/definitions/EvidenceRequest"
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "List of login events"
          schema:
            $ref: "#/definitions/SuspiciousSuccessfulEvidence"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
  /v2/sites/{siteId}/report/evidence/aggregators:
    post:
      tags:
      - "Evidence"
      summary: "Retrieve aggregated login report"
      description: "Retrieve the list of login events that were classified as coming\
        \ from known aggregators. If the API key used is for a parent account, and\
        \ the website belongs to a sub account, the caid of the sub account must be\
        \ specified."
      operationId: "getAggregatorsEvidence"
      produces:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Specify the time selection and/or endpoint ID"
        required: true
        schema:
          $ref: "#/definitions/EvidenceRequest"
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "List of aggregator login events"
          schema:
            $ref: "#/definitions/Evidence"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
  /v2/sites/{siteId}/report/evidence/leaked:
    post:
      tags:
      - "General"
      summary: "Retrieve the leaked users login report"
      description: "Retrieve the list of successful login events that used publicly\
        \ available leaked credentials. If the API key used is for a parent account,\
        \ and the website belongs to a sub account, the caid of the sub account must\
        \ be specified."
      operationId: "getLeakedReport"
      consumes:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Specify event selection range, PII password and endpoint ID"
        required: true
        schema:
          $ref: "#/definitions/ReportRequest"
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "List of login events, returned type is always LEAKED"
          schema:
            $ref: "#/definitions/LoginEvent"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
  /v2/sites/{siteId}/report/evidence/leaked-creds:
    post:
      tags:
      - "Evidence"
      summary: "Retrieve the leaked users login report"
      description: "Retrieve the list of successful login events that used publicly\
        \ available leaked credentials. If the API key used is for a parent account,\
        \ and the website belongs to a sub account, the caid of the sub account must\
        \ be specified."
      operationId: "getLeakedEvidence"
      produces:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Specify the time selection and/or endpoint ID"
        required: true
        schema:
          $ref: "#/definitions/EvidenceRequest"
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "List of login events, returned type is always LEAKED"
          schema:
            $ref: "#/definitions/Evidence"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
  /v2/sites/{siteId}/report/evidence/likely-leaked:
    post:
      tags:
      - "Evidence"
      summary: "Retrieve the likely leaked users login report"
      description: "Retrieve the list of likely leaked login events that potentially\
        \ used publicly available leaked credentials. If the API key used is for a\
        \ parent account, and the website belongs to a sub account, the caid of the\
        \ sub account must be specified."
      operationId: "getLikelyLeakedEvidence"
      produces:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Specify the time selection and/or endpoint ID"
        required: true
        schema:
          $ref: "#/definitions/EvidenceRequest"
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "List of likely leaked login events"
          schema:
            $ref: "#/definitions/LikelyLeakedEvidence"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        500:
          description: "Internal Server Error"
  /v2/sites/{siteId}/report/evidence/mitigated:
    post:
      tags:
      - "General"
      summary: "Retrieve the mitigated (CAPTCHA, BLOCK) users login report"
      description: "Retrieve the list of mitigated (CAPTCHA, BLOCK) login events.\
        \ If the API key used is for a parent account, and the website belongs to\
        \ a sub account, the caid of the sub account must be specified."
      operationId: "getMitigatedReport"
      consumes:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Specify event selection range, PII password and endpoint ID"
        required: true
        schema:
          $ref: "#/definitions/ReportRequest"
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      - name: "siteId"
        in: "path"
        description: "The Imperva ID of the website"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "List of login events, returned type is always MITIGATED"
          schema:
            $ref: "#/definitions/LoginEvent"
        400:
