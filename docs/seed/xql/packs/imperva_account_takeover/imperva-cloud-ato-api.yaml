  /v2/sites/{siteId}/reset-risk:
    post:
      tags:
      - "General"
      summary: "Reset the risk level of IPs for a specific site"
      description: "Resets the risk level assigned to an IP address by Account Takeover\
        \ Protection. Risk level indicates the severity of risk. \nIf there is continued\
        \ suspicious activity from an IP, the risk level will escalate again afterwards.\
        \ \nFor example:\n[\"192.20.1.1\",\"15.5.0.0\"] \nFor sites with ATO fingerprint\
        \ enabled, not all devices will have their risk reset. Priority will be given\
        \ to devices that were most recently active. \nIPV4 and IPV6 values are accepted\
        \ but IP ranges will be rejected \nThere is a limit of 10 IPs per request\
        \ \n"
      operationId: "resetRisk"
      parameters:
      - in: "body"
        name: "body"
        description: "List of IPs. The input must be a comma separated list of IP\
          \ addresses in JSON format. It can take up to one minute to fully process\
          \ the request after it has been sent."
        required: true
        schema:
          type: "array"
          items:
            type: "string"
      - name: "caid"
        in: "query"
        description: "The Imperva account ID. By default, the API operates on account\
          \ (A) associated with the API credentials used for authentication. To operate\
          \ on a different account (an account under the account (A)), specify the\
          \ account ID."
        required: false
        type: "integer"
        default: -1
        format: "int64"
      - name: "siteId"
        in: "path"
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "OK"
        400:
          description: "Bad Request"
        401:
          description: "Not Authorized"
        429:
          description: "Too many requests"
        500:
          description: "Internal Server Error"
