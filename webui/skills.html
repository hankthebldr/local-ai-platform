<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Skills - Local AI Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stat-card p {
            color: #666;
            font-size: 14px;
        }

        .controls {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-bar button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .search-bar button:hover {
            background: #5568d3;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .skill-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .skill-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .skill-card.installed::before {
            content: "✓ INSTALLED";
            position: absolute;
            top: 10px;
            right: 10px;
            background: #4CAF50;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .skill-title {
            flex: 1;
        }

        .skill-title h3 {
            color: #333;
            margin-bottom: 5px;
            font-size: 18px;
        }

        .skill-version {
            color: #999;
            font-size: 12px;
        }

        .skill-category {
            display: inline-block;
            padding: 4px 12px;
            background: #e3e8ff;
            color: #667eea;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .skill-description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .skill-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #999;
        }

        .skill-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .rating {
            color: #ffc107;
        }

        .skill-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .tag {
            padding: 4px 10px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 11px;
            color: #666;
        }

        .skill-tools {
            margin-bottom: 15px;
            font-size: 12px;
            color: #666;
        }

        .skill-tools strong {
            color: #333;
        }

        .skill-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #d32f2f;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .empty-state h2 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦞 OpenClaw Skills Registry</h1>
            <p>Browse, install, and manage AI agent skills for your Local AI Platform</p>
        </div>

        <div id="stats" class="stats">
            <!-- Stats will be populated by JavaScript -->
        </div>

        <div class="controls">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search skills by name, description, or tags...">
                <button onclick="searchSkills()">🔍 Search</button>
                <button onclick="loadSkills()">🔄 Refresh</button>
            </div>
            <div class="filters" id="filters">
                <!-- Filters will be populated by JavaScript -->
            </div>
        </div>

        <div id="skillsContainer" class="skills-grid">
            <div class="loading">Loading skills...</div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let allSkills = [];
        let currentFilter = null;

        // Load stats on page load
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/v1/skills/stats/overview`);
                const data = await response.json();

                const statsHTML = `
                    <div class="stat-card">
                        <h3>${data.total_skills}</h3>
                        <p>Total Skills</p>
                    </div>
                    <div class="stat-card">
                        <h3>${data.installed_skills}</h3>
                        <p>Installed</p>
                    </div>
                    <div class="stat-card">
                        <h3>${data.tools}</h3>
                        <p>Available Tools</p>
                    </div>
                    <div class="stat-card">
                        <h3>${data.categories}</h3>
                        <p>Categories</p>
                    </div>
                `;

                document.getElementById('stats').innerHTML = statsHTML;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load categories for filters
        async function loadCategories() {
            try {
                const response = await fetch(`${API_BASE}/v1/skills/categories`);
                const data = await response.json();

                const filtersHTML = `
                    <button class="filter-btn active" onclick="filterByCategory(null)">All</button>
                    ${data.categories.map(cat => `
                        <button class="filter-btn" onclick="filterByCategory('${cat.id}')">${cat.name}</button>
                    `).join('')}
                    <button class="filter-btn" onclick="filterByInstalled()">Installed Only</button>
                `;

                document.getElementById('filters').innerHTML = filtersHTML;
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        // Load all skills
        async function loadSkills(category = null, installedOnly = false) {
            try {
                let url = `${API_BASE}/v1/skills/list`;
                const params = new URLSearchParams();
                if (category) params.append('category', category);
                if (installedOnly) params.append('installed_only', 'true');

                if (params.toString()) url += `?${params}`;

                const response = await fetch(url);
                const data = await response.json();

                allSkills = data.skills;
                renderSkills(allSkills);
            } catch (error) {
                console.error('Error loading skills:', error);
                document.getElementById('skillsContainer').innerHTML = `
                    <div class="empty-state">
                        <h2>Error loading skills</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Render skills in the grid
        function renderSkills(skills) {
            if (skills.length === 0) {
                document.getElementById('skillsContainer').innerHTML = `
                    <div class="empty-state">
                        <h2>No skills found</h2>
                        <p>Try adjusting your search or filters</p>
                    </div>
                `;
                return;
            }

            const skillsHTML = skills.map(skill => `
                <div class="skill-card ${skill.installed ? 'installed' : ''}">
                    <div class="skill-header">
                        <div class="skill-title">
                            <h3>${skill.name}</h3>
                            <div class="skill-version">v${skill.version}</div>
                        </div>
                        <span class="skill-category">${skill.category}</span>
                    </div>

                    <p class="skill-description">${skill.description}</p>

                    <div class="skill-meta">
                        <span class="rating">★ ${skill.rating.toFixed(1)}</span>
                        <span>📥 ${skill.downloads.toLocaleString()}</span>
                        <span>👤 ${skill.author}</span>
                    </div>

                    <div class="skill-tags">
                        ${skill.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                    </div>

                    <div class="skill-tools">
                        <strong>Tools:</strong> ${skill.tools_required.join(', ')}
                    </div>

                    <div class="skill-actions">
                        ${skill.installed ? `
                            <button class="btn btn-danger" onclick="uninstallSkill('${skill.id}')">Uninstall</button>
                            <button class="btn btn-secondary" onclick="viewInstructions('${skill.id}')">View Instructions</button>
                        ` : `
                            <button class="btn btn-primary" onclick="installSkill('${skill.id}')">Install</button>
                            <button class="btn btn-secondary" onclick="viewDetails('${skill.id}')">Details</button>
                        `}
                    </div>
                </div>
            `).join('');

            document.getElementById('skillsContainer').innerHTML = skillsHTML;
        }

        // Filter by category
        function filterByCategory(category) {
            currentFilter = category;

            // Update active filter button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            loadSkills(category, false);
        }

        // Filter by installed
        function filterByInstalled() {
            loadSkills(null, true);
        }

        // Search skills
        async function searchSkills() {
            const query = document.getElementById('searchInput').value;
            if (!query) {
                loadSkills();
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/v1/skills/search?query=${encodeURIComponent(query)}`);
                const data = await response.json();

                renderSkills(data.results);
            } catch (error) {
                console.error('Error searching skills:', error);
            }
        }

        // Install skill
        async function installSkill(skillId) {
            if (!confirm(`Install skill '${skillId}'?`)) return;

            try {
                const response = await fetch(`${API_BASE}/v1/skills/install`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ skill_id: skillId, source: 'clawhub' })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`✓ ${data.message}`);
                    loadSkills(currentFilter);
                    loadStats();
                } else {
                    alert(`✗ Installation failed: ${data.detail}`);
                }
            } catch (error) {
                alert(`✗ Error: ${error.message}`);
            }
        }

        // Uninstall skill
        async function uninstallSkill(skillId) {
            if (!confirm(`Uninstall skill '${skillId}'?`)) return;

            try {
                const response = await fetch(`${API_BASE}/v1/skills/${skillId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`✓ ${data.message}`);
                    loadSkills(currentFilter);
                    loadStats();
                } else {
                    alert(`✗ Uninstallation failed: ${data.detail}`);
                }
            } catch (error) {
                alert(`✗ Error: ${error.message}`);
            }
        }

        // View skill details
        function viewDetails(skillId) {
            window.open(`${API_BASE}/docs#/skills/get_skill_v1_skills__skill_id__get`, '_blank');
        }

        // View instructions
        async function viewInstructions(skillId) {
            try {
                const response = await fetch(`${API_BASE}/v1/skills/${skillId}/instructions`);
                const data = await response.json();

                // Open in new window with formatted instructions
                const instructionsWindow = window.open('', '_blank');
                instructionsWindow.document.write(`
                    <html>
                        <head>
                            <title>${data.metadata.name || skillId} - Instructions</title>
                            <style>
                                body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
                                pre { background: #f5f5f5; padding: 15px; border-radius: 8px; overflow-x: auto; }
                            </style>
                        </head>
                        <body>
                            <h1>${data.metadata.name || skillId}</h1>
                            <pre>${data.instructions}</pre>
                        </body>
                    </html>
                `);
            } catch (error) {
                alert(`Error loading instructions: ${error.message}`);
            }
        }

        // Search on Enter key
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchSkills();
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadCategories();
            loadSkills();
        });
    </script>
</body>
</html>
