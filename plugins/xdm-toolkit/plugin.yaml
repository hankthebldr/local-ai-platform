id: xdm-toolkit
name: "XDM Toolkit"
version: "1.0.0"
description: "Skills + tools for writing Cortex XSIAM data model rules in XQL. Triggers on XQL/XDM keywords and exposes validate + lookup utilities."
author: "enclave"

# Skills auto-inject when the user message contains a trigger keyword.
# Each skill is a markdown body that the LLM reads as additional context.
skills:
  - id: "xdm-rule-writer"
    file: "skills/xdm-rule-writer.md"
    triggers:
      - keyword: "write XQL"
      - keyword: "data model rule"
      - keyword: "XDM rule"
      - keyword: "MODEL block"
      - keyword: "normalization rule"
      - manual: true

  - id: "xql-validator"
    file: "skills/xql-validator.md"
    triggers:
      - keyword: "validate XQL"
      - keyword: "check XQL"
      - keyword: "lint XQL"
      - keyword: "review my rule"
      - manual: true

  - id: "vendor-pack-author"
    file: "skills/vendor-pack-author.md"
    triggers:
      - keyword: "vendor pack"
      - keyword: "onboard vendor"
      - keyword: "new data source"
      - keyword: "XSIAM pack"
      - keyword: "three-artefact pack"
      - keyword: "parser and datamodel"
      - manual: true

# Tools are callable from any step's agentic loop. Each is a Python file
# implementing an `execute(params: dict) -> dict` entrypoint.
tools:
  - id: "validate_xql"
    file: "tools/validate_xql.py"
    function: "execute"
    description: |
      Static-validate an XQL data model rule. Catches: missing MODEL/INGEST
      header, missing MAPPED-header comment, unbalanced parens/brackets,
      unknown XDM paths, XDM_CONST default-value violations, missing
      companion-pair fields. Returns a structured pass/fail report.
    parameters:
      rule:
        type: string
        required: true
        description: "The XQL rule text to validate (full MODEL block including any leading comment)."

  - id: "lookup_xdm_path"
    file: "tools/lookup_xdm_path.py"
    function: "execute"
    description: |
      Lookup candidate XDM field paths for a vendor field name or short
      description. Returns the top 5 matches with confidence + companion
      pairs + XDM_CONST values when applicable. Backed by the 375-anchor
      synonym database mined from the 17-pack corpus.
    parameters:
      query:
        type: string
        required: true
        description: "Vendor field name (e.g. 'src.ip', 'event.kind') or short description (e.g. 'source IP address')."
      top_k:
        type: integer
        default: 5
        description: "Number of candidate matches to return (1..10)."

  - id: "analyse_xql"
    file: "tools/analyse_xql.py"
    function: "execute"
    description: |
      Run the full 82-rule XQL/XDM analyser against a rule body. Returns
      a structured report with rule IDs, severities, line numbers, and
      recommendations. Use this directly for high-fidelity validation;
      validate_xql is the legacy-shape shim.
    parameters:
      rule:
        type: string
        required: true
        description: "The XQL rule body (full MODEL or INGEST block)."
      kind:
        type: string
        default: "modeling"
        description: "Either 'modeling' or 'parsing'. Defaults to modeling."

  - id: "xdm_snippets"
    file: "tools/xdm_snippets.py"
    function: "execute"
    description: |
      Look up XQL/XDM code snippets by free-text query, category filter,
      pattern-family hint (A/B/C/D), and/or required tags. Reads the
      112-entry library shipped at docs/seed/xql/snippets.json.
    parameters:
      query:
        type: string
        default: ""
        description: "Free-text matched against title, tags, description."
      category:
        type: string
        default: ""
        description: "Exact category filter (e.g. 'Data Model Rules')."
      pattern:
        type: string
        default: ""
        description: "Pattern family hint (A/B/C/D)."
      tags:
        type: array
        default: []
        description: "Required tags (all must match)."
      top_k:
        type: integer
        default: 5
        description: "Number of snippets to return (1..20)."

  - id: "rag_lookup"
    file: "tools/rag_lookup.py"
    function: "execute"
    description: |
      Retrieve grounding chunks from the 'xql_corpus' Chroma collection
      built by scripts/ingest_xql_corpus.py. Optional metadata filters
      ({pack_name, pack_role, category}) narrow to specific packs or
      file roles (parser.xql vs datamodel.xql vs documentation.md).
      Returns top-k chunks with similarity score and source metadata.
    parameters:
      query:
        type: string
        required: true
        description: "Free-text query."
      top_k:
        type: integer
        default: 5
        description: "Number of chunks to return (1..20)."
      filters:
        type: object
        default: {}
        description: "Optional metadata equality filters."
