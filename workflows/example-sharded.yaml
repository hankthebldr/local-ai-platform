# ── Example: kind=parallel mode=sharded — one persona × N input shards ──
#
# Demonstrates the sharded parallel mode (Phase 2b of the multi-agent
# workflow patterns spec). Spec:
#   docs/plans/2026-05-23-multi-agent-workflow-patterns-spec.md §3.4
#
# Use case: you have a large input (here, a list of log files) and want to
# run the SAME analysis persona over each piece, then synthesize. You don't
# enumerate branches — you declare ONE persona + a shard strategy, and the
# engine clones the persona once per shard at runtime.
#
# Why sharded vs a hand-written fan-out: the shard count is data-driven (40
# files → 40 shards) and unknown at authoring time, and every shard uses the
# identical persona. Dispatch is sequential single-model, so on the BD790i a
# 34B stays loaded across all shards (prompt-cache reuse) rather than
# reloading per branch.

id: example-sharded
name: "Example: Per-Document Sharded Extraction"
schema_version: 1
description: |
  Split a list of documents into one shard each, run an extraction persona
  per shard, then synthesize all shard findings via the $shards accessor.

defaults:
  role: reasoning
  temperature: 0.3
  max_tokens: 2048

steps:
  - id: extract_all
    name: "Per-Document Extraction"
    kind: parallel
    inputs:
      - seed.documents
    outputs:
      - report
    execution:
      mode: sharded
      sharder: by_file            # one shard per element of seed.documents
      shard_input: seed.documents
      max_shards: 40              # cap fan-out; tail beyond this is dropped
      failure_policy: continue_on_partial   # one bad doc doesn't sink the run

    # Exactly ONE branch — the persona the engine clones per shard. Each clone
    # is seeded with seed.shard (this document), seed.shard_index, seed.shard_count.
    branches:
      - id: extractor
        name: "Document Extractor"
        role: fast
        prompt:
          role_inline: |
            You are a document extractor. Read the single document provided
            and emit a JSON object: { "entities": [...], "key_claims": [...] }.
            Process only the document you were given — don't speculate about others.
          task: "Extract entities and key claims from this one document"
        inputs:
          - seed.shard          # the engine injects this document here
        outputs:
          - extracted

    # Gather runs once after all shards, reading every shard's `extracted`
    # output via $shards.
    gather:
      id: synthesize
      name: "Synthesize Across Documents"
      role: reasoning
      prompt:
        role_inline: |
          You are the lead analyst. You have per-document extraction results
          from a set of documents. Produce a single consolidated report:
          dedupe entities, surface cross-document patterns, and flag any
          contradictions between documents.
        task: "Consolidate the per-document extractions into one report"
      inputs:
        - $shards.extracted       # list of every shard's `extracted` value
      outputs:
        - report
