# ── Example: kind=parallel + kind=loop composite workflow ─────────────
#
# Demonstrates the two new step kinds shipped in Phase 1 of the multi-agent
# workflow patterns spec. Spec:
#   docs/plans/2026-05-23-multi-agent-workflow-patterns-spec.md
#
# Stage 1 (kind=parallel): three specialist agents inspect the same input
#   from different angles, then a gather step synthesizes their findings.
# Stage 2 (kind=loop): the synthesized findings are refined via a
#   generator-critic loop until the critic approves or max_iterations is hit.
#
# This is a deliberately simple shape — the multi-agent gain is from
# (a) context isolation across the three branches and
# (b) iterative quality enforcement in the loop.

id: example-parallel-loop
name: "Example: Parallel Fan-Out + Refine Loop"
schema_version: 1
description: |
  Reference workflow showing kind=parallel and kind=loop composing on a
  single deployment. Branches run concurrently via the engine's existing
  ThreadPoolExecutor; on a single-Ollama box the gain is context isolation
  rather than wall-clock parallelism. The refine loop terminates as soon
  as the critic approves — most runs should converge in 1–2 iterations.

defaults:
  role: reasoning
  temperature: 0.4
  max_tokens: 4096
  retries: 1

steps:
  # ── Stage 1: fan-out / gather ─────────────────────────────────────
  - id: inspect
    name: "Multi-Angle Inspection"
    kind: parallel
    inputs:
      - seed.document
    outputs:
      - summary
    execution:
      mode: multi_model_concurrent
      max_concurrency: 3
      failure_policy: fail_fast

    branches:
      - id: extract_facts
        name: "Extract Facts"
        role: fast
        prompt:
          role_inline: |
            You are a fact extractor. Read the document and emit a JSON array
            of distinct, atomic facts. No interpretation, no opinions.
          task: "Extract atomic facts from seed.document"
        inputs:
          - seed.document
        outputs:
          - facts

      - id: classify_topics
        name: "Classify Topics"
        role: fast
        prompt:
          role_inline: |
            You are a topic classifier. Identify the top 3-5 topics covered
            by the document. Emit as a JSON array of topic strings.
          task: "Classify topics in seed.document"
        inputs:
          - seed.document
        outputs:
          - topics

      - id: flag_risks
        name: "Flag Risks"
        role: reasoning
        prompt:
          role_inline: |
            You are a risk reviewer. Identify any claims that should be
            independently verified, potential biases, or missing context.
            Emit as a JSON array of risk strings.
          task: "Flag risks in seed.document"
        inputs:
          - seed.document
        outputs:
          - risks

    gather:
      id: synthesize
      name: "Synthesize Findings"
      role: reasoning
      prompt:
        role_inline: |
          You are the lead reviewer. Three specialist agents have analyzed
          the document. Combine their findings into a single, coherent
          summary that mentions the facts, the topics, and the risks.
        task: "Synthesize the three branch reports into one summary"
      inputs:
        - extract_facts.facts
        - classify_topics.topics
        - flag_risks.risks
      outputs:
        - summary

  # ── Stage 2: refine until the critic approves ──────────────────────
  - id: refine
    name: "Refine Summary"
    kind: loop
    depends_on: [inspect]
    inputs:
      - inspect.summary
    outputs:
      - final_summary
    max_iterations: 4
    until:
      type: gate
      gate: "critic.approved == True"
      on_max_iterations: emit_best   # ship the last attempt rather than fail

    body:
      - id: editor
        name: "Editor"
        role: reasoning
        prompt:
          role_inline: |
            You are an editor. Tighten the summary for clarity and concision.
            Preserve every fact. Aim for under 200 words.
          task: "Edit the current draft of the summary"
        inputs:
          - inspect.summary
        outputs:
          - draft

      - id: critic
        name: "Critic"
        role: reasoning
        prompt:
          role_inline: |
            You are a strict critic. Score the draft on three dimensions
            (clarity, accuracy, concision). Set approved=true ONLY if the
            draft is publishable as-is. When you reject, the editor will
            see your feedback on the next iteration. Emit JSON with keys:
              { "approved": bool, "feedback": str, "final_summary": str }
            Always populate final_summary with the current best draft, even
            on rejection — the loop's emit_best policy needs a last-known
            output if max_iterations runs out.
          task: "Review the editor's draft and decide whether to approve"
        inputs:
          - editor.draft
        outputs:
          - approved
          - feedback
          - final_summary
