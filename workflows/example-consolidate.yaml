# ── Example: kind=consolidate — Dreaming-style cross-run memory ─────────
#
# Demonstrates the kind=consolidate step shipped in Phase 4 of the
# multi-agent workflow patterns spec. Spec:
#   docs/plans/2026-05-23-multi-agent-workflow-patterns-spec.md
#
# Shape:
#   1. A local llm step analyzes an incident report.
#   2. A consolidate step distills durable lessons into the incident_response
#      playbook — reading the existing playbook first so it can dedup, then
#      merging in only what's new.
#
# The next run of ANY workflow can read the accumulated playbook via a
# `$memory.playbook.incident_response` input. Over many runs the playbook
# becomes the operator's accumulated incident-response competence — a flat
# markdown file at data/playbooks/incident_response.md that a human can read,
# edit, or git-commit.
#
# This is the building block the autonomous `ralph` loop (a future phase)
# uses for self-learning: reflect on each iteration, append rules to the
# playbook, read them back on the next iteration.

id: example-consolidate
name: "Example: Incident Lesson Consolidation"
schema_version: 1
description: |
  Analyze an incident, then distill durable lessons into the incident_response
  playbook with dedup. Demonstrates kind=consolidate + the $memory.* accessor.

defaults:
  role: reasoning
  temperature: 0.3
  max_tokens: 2048

steps:
  # ── Stage 1: analyze the incident ────────────────────────────────────
  - id: analyze
    name: "Analyze Incident"
    role: reasoning
    prompt:
      role_inline: |
        You are an incident analyst. Read the post-incident report and
        identify root cause, contributing factors, and what would have
        caught this earlier.
      task: "Analyze the incident report"
    inputs:
      - seed.report
    outputs:
      - findings

  # ── Stage 2: consolidate durable lessons into the playbook ───────────
  - id: distill
    name: "Distill Lessons to Playbook"
    kind: consolidate
    depends_on: [analyze]
    inputs:
      - analyze.findings
      # Read the existing playbook so the consolidation prompt can avoid
      # re-stating rules we already captured.
      - $memory.playbook.incident_response
    outputs:
      - updated_playbook
    consolidate:
      target: playbook
      target_name: incident_response
      merge_strategy: append_with_dedup
      system_prompt: |
        You are the system's memory consolidator. Given this run's incident
        findings and the current playbook, extract durable lessons that should
        inform future incident response.

        For each lesson:
        - Phrase it as an imperative rule ("When X, prefer Y because Z").
        - Keep it concrete and actionable — no platitudes.
        - If a lesson is already covered by the current playbook, omit it.

        Output ONLY the new rules, one per line. If there are no genuinely
        new lessons, output a single line: "(no new lessons)".
