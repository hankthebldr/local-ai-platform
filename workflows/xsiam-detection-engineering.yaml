id: xsiam-detection-engineering
name: "XSIAM Detection Engineering Pipeline"
version: "1.0"
schema_version: 1
description: |
  Multi-stage detection engineering pipeline that takes a suspicious alert
  and produces a fully-documented XSIAM detection: classification, IOC
  extraction, enrichment query design, XQL detection rule, static
  validation, and an operator runbook.

  6-step pipeline:
    1. classify_event       — Fast classification (event type, severity, vendor).
    2. extract_iocs         — Pull IPs / users / hosts / hashes / domains / URLs.
    3. enrich_context       — Propose XQL enrichment queries (uses xdm-toolkit
                              skill via "xql"/"xdm" trigger keywords + web-search
                              skill via "search"/"find online" triggers).
    4. draft_detection      — Author the XQL alert rule grounded in the XDM
                              schema. Heaviest reasoning step.
    5. validate_detection   — Static-validate the rule and surface issues.
    6. document_runbook     — Produce a markdown runbook section for the SOC.

  Three different models, tuned to each stage:
    - qwen2.5:1.5b          (fast classification + extraction + runbook prose)
    - qwen2.5-coder:1.5b    (XQL-shaped output: enrichment queries + validation)
    - llama3.2:3b           (reasoning-heavy detection drafting)

  References two skills via the plugin trigger mechanism:
    - xdm-toolkit's XQL/XDM skill (keywords: xql, xdm)
    - web-search's search-expert skill (keywords: search, find online)

defaults:
  role: reasoning
  temperature: 0.4
  max_tokens: 4096
  retries: 1
  retry_delay: 3

context:
  description: |
    Required seed keys:
      alert_id     — string, unique identifier for this alert / event
      raw_log      — string, the raw log payload triggering the workflow
      asset_info   — optional dict {hostname, owner, criticality}
      timeframe    — optional dict {start, end} ISO timestamps

steps:
  # ── Step 1: Fast classification ─────────────────────────────────────────
  - id: classify_event
    name: "Classify Event Type"
    model: qwen2.5:1.5b
    role: fast
    system_prompt: |
      You are a fast event classifier for Cortex XSIAM. Read the raw log
      and emit ONLY a JSON object with these keys (no prose, no fences):

        {
          "event_category": "auth | network | process | file | alert | dns | other",
          "event_severity": "critical | high | medium | low | info",
          "vendor_hint":    "best guess at the vendor (e.g. Cisco, Okta, CrowdStrike, generic)",
          "one_line":       "human summary, max 120 chars"
        }

      Pure JSON only. If the sample is too short to classify, return the
      best-effort guess with event_severity = "info".
    inputs:
      - seed.alert_id
      - seed.raw_log
    outputs:
      - event_category
      - event_severity
      - vendor_hint
      - one_line
    output_format: json
    config:
      temperature: 0.2
      max_tokens: 512

  # ── Step 2: IOC extraction ──────────────────────────────────────────────
  - id: extract_iocs
    name: "Extract Indicators of Compromise"
    model: qwen2.5:1.5b
    role: fast
    system_prompt: |
      You are an IOC extractor. From the raw log + classification, pull
      every observable IOC into a JSON object. Empty arrays are fine.

        {
          "ips":     ["1.2.3.4"],
          "domains": ["example.com"],
          "users":   ["alice"],
          "hosts":   ["workstation-07"],
          "hashes":  ["<sha256/md5/sha1>"],
          "files":   ["/path/to/binary"],
          "urls":    ["https://..."]
        }

      Pure JSON. Deduplicate. Do NOT invent IOCs that aren't in the input.
    inputs:
      - seed.raw_log
      - classify_event.event_category
      - classify_event.vendor_hint
    outputs:
      - ips
      - domains
      - users
      - hosts
      - hashes
      - files
      - urls
    output_format: json
    config:
      temperature: 0.1
      max_tokens: 1024

  # ── Step 3: Enrichment query design (uses 2 skills) ─────────────────────
  - id: enrich_context
    name: "Design XQL Enrichment Queries"
    model: qwen2.5-coder:1.5b
    role: coding
    system_prompt: |
      You are an enrichment-query designer for Cortex XSIAM (XQL). Given
      the classification, IOCs, asset info, and timeframe, propose up to
      5 XQL enrichment queries an analyst should run to widen the
      investigation.

      Skill triggers in this step:
        - Mention "xql" and "xdm" so the xdm-toolkit XQL/XDM skill is
          injected — it grounds your XQL syntax in canonical xdm.* paths.
        - For OSINT context (vendor advisories, reputation lookups),
          mention "search" or "find online" so the web-search skill is
          available.

      Return JSON only:
        {
          "enrichment_queries": [
            {
              "name":        "short snake_case name",
              "purpose":     "what we learn from running this",
              "xql":         "config case_sensitive = false\\ndataset = xdm.network\\n| ...",
              "uses_skill":  "xql | search | none",
              "time_window": "1h | 24h | 7d | 30d"
            }
          ]
        }
    inputs:
      - classify_event.event_category
      - classify_event.event_severity
      - extract_iocs.ips
      - extract_iocs.users
      - extract_iocs.hosts
      - extract_iocs.domains
      - seed.asset_info
      - seed.timeframe
    outputs:
      - enrichment_queries
    output_format: json
    config:
      temperature: 0.5
      max_tokens: 2048

  # ── Step 4: Draft the detection rule (heaviest reasoning) ───────────────
  - id: draft_detection
    name: "Draft XQL Detection Rule"
    model: llama3.2:3b
    role: reasoning
    system_prompt: |
      You are a senior detection engineer authoring an XQL alert rule for
      Cortex XSIAM. Use the classification, IOCs, and enrichment context
      to write a detection that fires when the same threat pattern
      reoccurs — not just the literal IOCs, but the underlying behaviour.

      Reference the xdm-toolkit XQL/XDM skill: ground every field name
      in canonical XDM paths (xdm.network.*, xdm.source.*, xdm.target.*,
      xdm.event.*, xdm.alert.*). Do NOT invent paths — if you are unsure
      of a path, leave a placeholder and flag it in xdm_paths_used.

      Return JSON only:
        {
          "alert_name":       "snake_case_name_for_the_alert",
          "alert_purpose":    "one-paragraph rationale, why this matters",
          "xql_rule":         "config case_sensitive = false\\ndataset = ...\\n| where ...\\n| alter ...\\n| comp count() as cnt by ...",
          "xdm_paths_used":   ["xdm.network.dst_ip", "xdm.source.user.username", "..."],
          "mitre_techniques": ["T1234.001", "T5678"]
        }
    inputs:
      - classify_event.event_category
      - classify_event.event_severity
      - classify_event.vendor_hint
      - extract_iocs.ips
      - extract_iocs.users
      - extract_iocs.hosts
      - enrich_context.enrichment_queries
    outputs:
      - alert_name
      - alert_purpose
      - xql_rule
      - xdm_paths_used
      - mitre_techniques
    output_format: json
    config:
      temperature: 0.4
      max_tokens: 3072

  # ── Step 5: Static validation ───────────────────────────────────────────
  - id: validate_detection
    name: "Statically Validate XQL"
    model: qwen2.5-coder:1.5b
    role: coding
    system_prompt: |
      You are an XQL static validator. Inspect the draft detection rule
      for:
        - Syntax issues (unbalanced pipes, missing dataset, malformed
          operators, missing config line).
        - Schema issues (xdm.* paths that don't look canonical).
        - Cost issues (no time filter, no dataset narrowing, unbounded
          comp aggregations).
        - Logic issues (impossible conditions, dead branches).

      Return JSON only:
        {
          "verdict":          "PASS | NEEDS_FIX | BLOCKER",
          "issues": [
            {"severity": "info|warn|error", "message": "...", "fix_hint": "..."}
          ],
          "fix_suggestions":  ["short actionable suggestion", "..."]
        }
    inputs:
      - draft_detection.xql_rule
      - draft_detection.xdm_paths_used
    outputs:
      - verdict
      - issues
      - fix_suggestions
    output_format: json
    config:
      temperature: 0.1
      max_tokens: 1536

  # ── Step 6: Runbook ─────────────────────────────────────────────────────
  - id: document_runbook
    name: "Generate Operator Runbook"
    model: qwen2.5:1.5b
    role: general
    system_prompt: |
      You are an operations writer creating a runbook for the SOC. Use
      every prior step's output to produce a markdown runbook section
      that a tier-1 analyst can follow in the first 15 minutes after
      this alert fires.

      Required structure (use the alert_name from draft_detection as the H1):

        # <alert_name>

        **Purpose:** <alert_purpose, paraphrased to one sentence>
        **Severity:** <event_severity>
        **MITRE:** <comma-separated mitre_techniques>

        ## Detection logic
        Two-sentence explanation of what the XQL rule looks for.

        ## Triage steps
        Numbered list of 3–6 concrete steps for the analyst.

        ## Enrichment queries
        For each enrichment query: name + one-line purpose. Note when the
        query mentions "xql" or "xdm" (uses the xdm-toolkit skill) vs
        when it would benefit from "search" / OSINT (uses web-search).

        ## Containment options
        Bulleted list of containment actions if the alert is confirmed.

        ## False-positive rationale
        One paragraph on legitimate behaviour that may match this rule.

      Output: pure markdown. No JSON, no code fences around the whole thing.
    inputs:
      - classify_event.event_severity
      - classify_event.one_line
      - extract_iocs.ips
      - extract_iocs.users
      - extract_iocs.hosts
      - enrich_context.enrichment_queries
      - draft_detection.alert_name
      - draft_detection.alert_purpose
      - draft_detection.xql_rule
      - draft_detection.mitre_techniques
      - validate_detection.verdict
      - validate_detection.fix_suggestions
    outputs:
      - runbook_markdown
    output_format: text
    config:
      temperature: 0.4
      max_tokens: 2048
