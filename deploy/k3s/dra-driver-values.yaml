# Helm values for the NVIDIA DRA Driver for GPUs (nvidia/dra-driver-nvidia-gpu, v0.4.0).
#
# This is the "recently released" NVIDIA Kubernetes GPU plugin — the Dynamic
# Resource Allocation (DRA) driver that replaces the classic device plugin's
# `nvidia.com/gpu: 1` counting model with structured ResourceClaims. Installed
# on the homelab k3s cluster (server ms-01, k8s 1.34 → DRA is GA) to schedule
# the Blackwell GPU on bd790i to the enclave-vllm pod.
#
#   helm upgrade --install nvidia-dra-driver-gpu nvidia/dra-driver-nvidia-gpu \
#     --version 0.4.0 -n nvidia-dra-driver-gpu --create-namespace \
#     -f deploy/k3s/dra-driver-values.yaml
#
# Verify:  kubectl get deviceclasses ; kubectl get resourceslices

# The GPU kubelet plugin is OFF by default (GPU allocation is the driver's
# newer, experimental half — its officially-supported feature is ComputeDomains
# for multi-node NVLink, which a single-node homelab doesn't use). Turn it on:
gpuResourcesEnabledOverride: true

resources:
  gpus:
    enabled: true
  computeDomains:
    # No multi-node NVLink on this single Blackwell card — drop the extra
    # privileged ComputeDomain container and its DeviceClasses.
    enabled: false

kubeletPlugin:
  # The chart's default nodeAffinity requires Node Feature Discovery labels
  # (feature.node.kubernetes.io/pci-10de.present). NFD isn't installed on this
  # cluster, so drop that affinity and pin the GPU DaemonSet to GPU nodes via
  # the label the homelab toolchain already applies (same one the classic
  # device plugin keys on). The default toleration for nvidia.com/gpu:NoSchedule
  # (bd790i's taint) is kept by the chart, so no toleration override is needed.
  affinity: {}
  nodeSelector:
    nvidia.com/gpu.present: "true"
