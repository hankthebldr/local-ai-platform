# vLLM — primary GPU inference backend (the k3s port of the compose `vllm` svc).
#
# Serves nvidia/Qwen3-8B-NVFP4 over the OpenAI API on :8000, on the Blackwell
# GPU on bd790i. The GPU is scheduled via the NVIDIA DRA Driver for GPUs (the
# "recently released" NVIDIA k8s plugin — Dynamic Resource Allocation, GA in
# k8s 1.34) installed by deploy/k3s/dra-driver-values.yaml, NOT the classic
# device plugin. Instead of `resources.limits.nvidia.com/gpu: 1`, the pod
# references a ResourceClaimTemplate that asks the DRA scheduler for one device
# from DeviceClass gpu.nvidia.com; the kubelet plugin then injects that exact
# GPU into the container via CDI on the default (runc) runtime.
#
# WHY NO runtimeClassName: nvidia — that is the legacy device-plugin path
# (nvidia-container-runtime + NVIDIA_VISIBLE_DEVICES hook injection). Under DRA
# the GPU arrives via CDI regardless of runtime class; keeping the nvidia
# runtime with NVIDIA_VISIBLE_DEVICES=all would inject ALL GPUs and bypass DRA's
# allocation. So we run on the default runtime and let DRA/CDI do the injection.
#
# MODEL REUSE: mounts the existing docker volume dir
#   /var/lib/docker/volumes/enclave-vllm-models/_data → /models (HF_HOME)
# so the ~6.4 GB NVFP4 weights already downloaded under compose are reused —
# no re-download, no HF token needed for the cached model. This pins the pod to
# bd790i (where that data lives), which is also the only GPU node — matching
# nodeSelector: nvidia.com/gpu.present.
---
# The DRA request: one whole GPU from DeviceClass gpu.nvidia.com (advertised by
# the DRA kubelet plugin in a ResourceSlice on bd790i). resource.k8s.io/v1 is
# the GA API (k8s 1.34+); the request lives under .spec.spec.devices.requests
# with the count/class nested in `exactly` (the v1 shape — older examples that
# put deviceClassName directly under the request are v1beta1).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: enclave-vllm-gpu
  namespace: enclave
  labels:
    app: enclave-vllm
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            allocationMode: ExactCount
            count: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enclave-vllm
  namespace: enclave
  labels:
    app: enclave-vllm
spec:
  replicas: 1
  strategy:
    type: Recreate          # single GPU — never run two pods contending for it
  selector:
    matchLabels:
      app: enclave-vllm
  template:
    metadata:
      labels:
        app: enclave-vllm
    spec:
      # No runtimeClassName: the DRA kubelet plugin injects the claimed GPU via
      # CDI on the default runtime (see header). nodeSelector + the hostPath
      # model volume keep the pod on bd790i (the only GPU node).
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu        # bd790i is tainted by the GPU join toolchain
          operator: Exists
          effect: NoSchedule
      # Bind the ResourceClaimTemplate above to this pod; the container then
      # references the claim by name under resources.claims.
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: enclave-vllm-gpu
      containers:
        - name: vllm
          # PINNED to v0.17.1 — the last vLLM release known-good for NVFP4 on
          # the RTX PRO 4000 (SM120) per field reports. v0.18.1+ rewrote the
          # engine (V1) and regressed SM120: a ~3x throughput drop AND the
          # kv-cache scale loader bug (KVCacheScaleParameter.weight_loader() arg
          # count) that crashes engine init on nvidia/Qwen3-8B-NVFP4. v0.23.0
          # (current :latest, and the latest stable) is still affected. Do not
          # bump to :latest without re-validating NVFP4 on this card.
          image: vllm/vllm-openai:v0.17.1
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - nvidia/Qwen3-8B-NVFP4
            - --quantization
            - modelopt
            # No explicit --kv-cache-dtype: the NVFP4 checkpoint declares fp8 KV
            # (hf_quant_config), so vLLM enables it from the model config. v0.17.1
            # loads the k/v-cache scales correctly (the loader regression is a
            # v0.18.1+ V1-engine bug). Leaving the flag off avoids the e5m2/e4m3
            # ambiguity; the model drives e4m3.
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --gpu-memory-utilization
            - "0.85"
            - --max-model-len
            - "8192"
            - --max-num-seqs
            - "16"
          env:
            - name: HF_HOME
              value: /models
            # No NVIDIA_VISIBLE_DEVICES — GPU visibility is handled by the DRA
            # claim + CDI injection, not the nvidia-container-runtime hook.
            # If you ever switch to a gated/un-cached model, supply a token:
            #   kubectl -n enclave create secret generic hf-token \
            #     --from-literal=token=hf_xxx
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8000
          resources:
            claims:
              - name: gpu        # consume the DRA-allocated GPU (see resourceClaims)
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm   # vLLM workers need a large shared-memory seg
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 60    # up to 10 min for first model load
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: models
          hostPath:
            path: /var/lib/docker/volumes/enclave-vllm-models/_data
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: enclave-vllm
  namespace: enclave
  labels:
    app: enclave-vllm
spec:
  selector:
    app: enclave-vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
