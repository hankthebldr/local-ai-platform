id: "default"
name: "Default Profile"
description: "All plugins allowed, strict filesystem sandboxing"
version: "1.0.0"

allowed_plugins: ["*"]

tool_rules: {}

sandbox:
  mode: "strict"
  root_dir: "data/sandboxes/{conversation_id}"
  max_file_size_mb: 10
  allowed_extensions: null

network:
  mode: "unrestricted"
  allowed_hosts: []

bound_to_keys: []

rag:
  enabled: true
  max_upload_mb: 50
