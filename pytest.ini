[pytest]
markers =
    integration: requires Ollama running with models (deselect with '-m "not integration"')
    e2e: canonical end-to-end suite — Playwright browser tests + workflow-execution tests against a live compose stack at http://localhost:8000. Auto-applied to everything under tests/playwright/. Skip with '-m "not e2e"'.
    rag: requires RAG dependencies (langchain, chromadb, sentence-transformers)
    playwright: legacy alias for the e2e marker (kept so older invocations still work). Prefer -m e2e going forward.
    slow: heavy tests that actually execute workflows or chats against a model — usually 30s+ each. Deselect with '-m "not slow"'.
testpaths = tests
